/* Layout: one-screen game. A living sky-and-meadow scene sits behind everything; the garden beds
   stand directly on the meadow, the other rooms are jade-glass sheets, a tab rail runs along the bottom. */
:root{
  --jade:#eaf2ec; --jade-2:#d9e7de; --glass:rgba(238,246,241,.9);
  --ink:#22393a; --ink-soft:#587370; --line:rgba(34,57,58,.15);
  --rouge:#c4426a; --rouge-soft:#f6dbe4; --wisteria:#7f6bc4; --gamboge:#c98a1e; --leaf:#4f8f62;
  --soil:#7a5740; --silk:#ddd5c0; --white:#ffffff; --shadow:rgba(28,48,50,.18);
  --sky1:#bfe0ee; --sky2:#f4f3e2; --night:0;
  --f-display:"Ma Shan Zheng","STKaiti","KaiTi","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--jade);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--wisteria);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- scene ---------- */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 58%)}
.stars{position:absolute;inset:0 0 45% 0;opacity:var(--night);
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--white),transparent),radial-gradient(1px 1px at 28% 42%,var(--white),transparent),radial-gradient(1.4px 1.4px at 44% 12%,var(--white),transparent),radial-gradient(1px 1px at 58% 34%,var(--white),transparent),radial-gradient(1.3px 1.3px at 71% 16%,var(--white),transparent),radial-gradient(1px 1px at 86% 40%,var(--white),transparent),radial-gradient(1.2px 1.2px at 93% 10%,var(--white),transparent),radial-gradient(1px 1px at 6% 52%,var(--white),transparent),radial-gradient(1px 1px at 36% 62%,var(--white),transparent),radial-gradient(1.2px 1.2px at 66% 58%,var(--white),transparent)}
.orb{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);left:20%;top:20%}
.orb.sun{background:radial-gradient(circle,#fffdf0 30%,#ffe9a8 60%,rgba(255,233,168,0) 72%);box-shadow:0 0 60px 20px rgba(255,236,180,.5)}
.orb.moon{background:radial-gradient(circle at 38% 36%,#fdfdf4,#dfe3f0 70%);box-shadow:0 0 40px 10px rgba(220,226,255,.35);width:44px;height:44px}
.cloud{position:absolute;height:26px;border-radius:26px;background:var(--white);opacity:calc(.7 - var(--night)*.5);filter:blur(1px);animation:cloud linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:var(--white);border-radius:50%}
.cloud::before{width:44%;height:180%;left:16%;top:-80%}.cloud::after{width:34%;height:140%;left:50%;top:-50%}
.c1{width:150px;top:9%;animation-duration:140s}.c2{width:100px;top:20%;animation-duration:190s;animation-delay:-80s}.c3{width:190px;top:4%;animation-duration:230s;animation-delay:-150s}
@keyframes cloud{from{left:-220px}to{left:105%}}
.hills{position:absolute;left:-2%;top:20%;height:30%;width:104%}
.meadow{position:absolute;left:0;right:0;top:46%;bottom:0;background:linear-gradient(#8fc294,#79b085 40%,#5f9a72)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.veil{position:absolute;inset:0;background:#141a44;opacity:calc(var(--night)*.46);pointer-events:none}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#f4ffb0;box-shadow:0 0 10px 4px rgba(236,255,150,.7);opacity:calc(var(--night)*.9);animation:fly 9s ease-in-out infinite alternate}
@keyframes fly{0%{transform:translate(0,0)}33%{transform:translate(30px,-24px)}66%{transform:translate(-18px,-40px)}100%{transform:translate(22px,-8px)}}

/* ---------- top bar ---------- */
.top{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px 6px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.logo{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.6);white-space:nowrap}
.night-on .logo{color:#f3f0ff;text-shadow:none}
.phase{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--glass);color:var(--ink-soft);white-space:nowrap}
.stats{display:flex;align-items:center;gap:6px;flex-shrink:0}
.pill{display:flex;align-items:center;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.pill b{font-weight:700}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a6,var(--gamboge));display:inline-block;flex-shrink:0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.xp{width:44px;height:5px;border-radius:9px;background:var(--line);overflow:hidden}.xp i{display:block;height:100%;background:var(--leaf);border-radius:9px;transition:width .4s}
.snd{display:grid;place-items:center}
.snd svg{width:16px;height:16px}.snd.off{color:var(--ink-soft);opacity:.75}

/* ---------- views ---------- */
main{position:relative;z-index:2;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-block:4px 14px;-webkit-overflow-scrolling:touch}
.sheet{max-width:980px;margin:0 auto;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:20px;padding:16px;box-shadow:0 10px 30px var(--shadow)}
.h-title{font-family:var(--f-display);font-size:24px;line-height:1.2;margin:0}
.h-sub{color:var(--ink-soft);font-size:12.5px;margin:2px 0 12px}
h3.sec{font-size:14px;font-weight:700;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.muted{color:var(--ink-soft)}

/* garden */
#v-garden{display:flex;flex-direction:column;align-items:center;overflow:hidden}
.hint{margin-top:2px;padding:4px 14px;border-radius:99px;background:var(--glass);font-size:13px;box-shadow:0 2px 8px var(--shadow);text-align:center;max-width:100%}
.g-space{flex:1;min-height:4px}
.plots{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 8px;width:min(100%,640px,calc((100vh - 260px)*1.17));filter:brightness(calc(1 - var(--night)*.26)) saturate(calc(1 - var(--night)*.15))}
.plot{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0}
.plot svg{width:100%;aspect-ratio:100/112;overflow:visible;display:block}
.plot .pinfo{height:20px;display:flex;align-items:center;gap:5px;font-size:11.5px;padding:0 8px;border-radius:99px;background:rgba(245,250,246,.82);white-space:nowrap;max-width:100%;overflow:hidden}
.plot .pbar{width:26px;height:4px;border-radius:4px;background:var(--line);overflow:hidden;flex-shrink:0}.plot .pbar i{display:block;height:100%;background:var(--leaf)}
.plot.dry .pbar i{background:var(--gamboge)}
.plot.empty .pinfo,.plot.locked .pinfo{background:rgba(245,250,246,.5);color:var(--ink-soft)}
.plot.locked svg{opacity:.45}
.plot.bloom .pinfo{background:var(--rouge);color:var(--white)}
.badge{position:absolute;top:8%;right:8%;width:24px;height:24px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 2px 6px var(--shadow);animation:bob 1.4s ease-in-out infinite}
.badge svg{width:13px;height:13px}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 4s ease-in-out infinite;transform-origin:0 0}
@keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.halo{animation:halo 3s ease-in-out infinite}
@keyframes halo{50%{opacity:.45}}
.g-tools{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.tool{display:flex;align-items:center;gap:6px;font-size:13px}
.tool svg{width:16px;height:16px}
.tool.on{background:var(--leaf);color:var(--white)}
.tool:disabled{opacity:.5;cursor:default}
.windseed{position:absolute;left:-70px;top:12%;width:54px;height:54px;z-index:4;animation:drift 16s linear forwards}
.windseed svg{width:100%;height:100%;animation:bob2 2.6s ease-in-out infinite;filter:drop-shadow(0 0 8px rgba(255,255,255,.9))}
@keyframes drift{to{transform:translateX(calc(100vw + 160px))}}
@keyframes bob2{50%{transform:translateY(22px) rotate(12deg)}}
.pop{position:absolute;z-index:6;pointer-events:none;font-size:13px;font-weight:700;color:var(--white);text-shadow:0 1px 4px rgba(0,0,0,.45);animation:pop 1.3s ease-out forwards;white-space:nowrap;transform:translate(-50%,0)}
@keyframes pop{to{transform:translate(-50%,-56px);opacity:0}}
.pt{position:absolute;z-index:6;pointer-events:none;width:9px;height:12px;border-radius:60% 60% 60% 60%/80% 80% 40% 40%;animation:pt .9s ease-out forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.drop{position:absolute;z-index:6;pointer-events:none;width:5px;height:9px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:#9fd6f2;animation:drop .6s ease-in forwards}
@keyframes drop{from{transform:translateY(-34px);opacity:0}30%{opacity:1}to{transform:translateY(8px);opacity:0}}

/* buttons / cards */
.btn{font-size:13px;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{background:rgba(255,255,255,.7);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;position:relative}
button.card{transition:transform .15s}button.card:hover{transform:translateY(-2px)}
.card .ico{width:64px;height:83px}
.card .nm{font-weight:700;font-size:13.5px}
.card .meta{font-size:11.5px;color:var(--ink-soft);line-height:1.4}
.grid .card>.btn:last-child{margin-top:auto}
.rar{font-size:10.5px;padding:0 7px;border-radius:99px;line-height:17px;color:var(--white)}
.r0{background:#7fa58c}.r1{background:#5c8fc9}.r2{background:var(--wisteria)}.r3{background:linear-gradient(90deg,#d79a2a,#d2587d)}
.price{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.unknown .ico{filter:brightness(0);opacity:.14}
.seeded .ico{filter:grayscale(.85);opacity:.6}

/* studio */
.studio{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.studio{grid-template-columns:minmax(0,1fr)}#stage{width:min(100%,calc(54vh*.93));margin:0 auto}}
@media (max-width:420px){.logo{font-size:24px}.xp{width:24px}.stats{gap:5px}}
.stage-col{min-width:0}
#stage{border-radius:16px;overflow:hidden;touch-action:none;box-shadow:0 8px 24px var(--shadow);max-width:100%;aspect-ratio:520/560;background:var(--jade-2);user-select:none;-webkit-user-select:none}
#stage svg{display:block;width:100%;height:100%}
#stage .stem{cursor:grab}
.seltools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;min-height:28px;align-items:center}
.tray{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.tray button{flex:0 0 auto;width:68px;background:rgba(255,255,255,.7);border-radius:12px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;font-size:11.5px;line-height:1.3}
.tray .ico{width:44px;height:57px}
.tray b{font-variant-numeric:tabular-nums;color:var(--rouge)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;display:flex;align-items:center;gap:5px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px var(--line)}
.meter{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px}
.meter .big{grid-row:span 5;text-align:center;padding-right:4px}
.meter .big b{font-size:30px;line-height:1;font-variant-numeric:tabular-nums;display:block;font-weight:700}
.meter .big span{font-size:11px;color:var(--ink-soft)}
.bar{display:flex;align-items:center;gap:8px;font-size:11.5px}.bar em{font-style:normal;width:28px;color:var(--ink-soft)}
.bar div{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--wisteria);transition:width .3s}
.tip{font-size:12.5px;color:var(--ink-soft);margin:6px 2px 0}
.order{background:rgba(255,255,255,.7);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.order .who{font-weight:700;font-size:13px}
.order .say{font-size:13px;margin:2px 0 6px}
.req{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:0 8px;border-radius:99px;line-height:20px;background:var(--jade-2);margin:0 4px 4px 0}
.req.ok{background:var(--leaf);color:var(--white)}
.order .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.rate{letter-spacing:2px;color:var(--gamboge)}

/* gallery */
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.work{background:rgba(255,255,255,.75);border-radius:14px;padding:8px;text-align:center;min-width:0}
.work svg{width:100%;border-radius:10px;display:block}
.work .nm{font-family:var(--f-display);font-size:18px;line-height:1.3;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-note{padding:26px 10px;text-align:center;color:var(--ink-soft)}

/* toasts / modal */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#toasts{position:absolute;z-index:20;top:54px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--jade);padding:7px 16px;border-radius:99px;font-size:13px;box-shadow:0 6px 18px var(--shadow);animation:toast 3.2s ease forwards;max-width:100%;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(-8px)}8%,85%{opacity:1;transform:none}100%{opacity:0}}
#modal{position:absolute;inset:0;z-index:15;background:rgba(24,40,44,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.dialog{background:var(--jade);border-radius:22px;padding:18px;max-width:440px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:dlg .25s ease}
.dialog.wide{max-width:560px}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dialog .big-ico{width:140px;height:182px;display:block;margin:0 auto}
.dialog .center{text-align:center}
.lang{font-family:var(--f-display);font-size:22px;line-height:1.4;color:var(--rouge)}
.dialog .thumb{width:170px;border-radius:12px;display:block;margin:0 auto 8px;box-shadow:0 6px 16px var(--shadow)}
.inp{height:36px;border-radius:99px;border:1px solid var(--line);background:var(--white);padding:0 14px;font:inherit;color:var(--ink);width:100%;min-width:0}
.steps{margin:10px 0 14px;padding:0;list-style:none;display:grid;gap:8px}
.steps li{background:rgba(255,255,255,.65);border-radius:12px;padding:8px 12px;font-size:13px}
.steps b{color:var(--rouge)}
@media (prefers-reduced-motion:reduce){
  .cloud,.sway,.halo,.badge,.fly,.windseed svg{animation:none}
  .windseed{animation:none;left:50%;top:14%}
}
/* ---------- v2: motion, weather, scroll mounting ---------- */
.view{animation:viewin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes viewin{from{opacity:0;transform:translateY(14px)}}
#v-garden{animation-name:fadein}@keyframes fadein{from{opacity:0}}
.grid>*,.works>*{animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*35ms)}
@keyframes cardin{from{opacity:0;transform:translateY(16px) scale(.94)}}
.btn,.tool,.tab,.chip,.card,.tray button,.plot{transition:transform .15s,background .2s,box-shadow .2s}
.btn:active,.tool:active,.tab:active,.chip:active,button.card:active,.tray button:active,.plot:active{transform:scale(.94)}
.tool:hover,.chip:hover,.tray button:hover,.plot:hover{transform:translateY(-2px)}
.hills,.cot{translate:calc(var(--px,0)*-12px) calc(var(--py,0)*-5px);transition:translate .5s ease-out}
.orb,.cloud{translate:calc(var(--px,0)*-5px) 0;transition:translate .5s ease-out}
.cot{position:absolute;right:9%;top:calc(34% - 62px);width:110px}
.cot .win{opacity:calc(.2 + var(--night)*.8)}
.bow{position:absolute;left:50%;top:13%;width:min(130vmin,1150px);aspect-ratio:2/1;transform:translateX(-50%);opacity:0;transition:opacity 3s;filter:blur(2px);
  background:radial-gradient(ellipse 50% 100% at 50% 100%,transparent 86%,rgba(190,120,255,.5) 87.5%,rgba(90,150,255,.5) 89.5%,rgba(90,210,150,.5) 91.5%,rgba(255,235,110,.5) 93.5%,rgba(255,165,80,.5) 95.5%,rgba(255,95,95,.5) 97.5%,transparent 99%)}
.rainbow .bow{opacity:.9}
.rainveil{position:absolute;inset:0;background:#5d7186;opacity:0;transition:opacity 2s;pointer-events:none}
.rain .rainveil{opacity:.32}
.popin{animation:bloompop .75s cubic-bezier(.2,1.7,.4,1)}
@keyframes bloompop{from{transform:scale(.5)}}
.spark{position:absolute;z-index:6;pointer-events:none;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff 30%,rgba(255,236,160,.9) 52%,transparent 72%);animation:pt 1s ease-out forwards}
.plot.pick svg{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #ffd76a)}
.plot.poled .pinfo::after{content:"";width:6px;height:8px;border-radius:50%;background:#f1cf6d;flex-shrink:0}
.bfly{position:absolute;z-index:7;width:36px;height:32px;pointer-events:none;translate:-50% -50%}
.bfly svg{width:100%;height:100%;overflow:visible}
.bfly .wings{animation:flap .16s ease-in-out infinite alternate;transform-origin:17px 15px}
@keyframes flap{to{transform:scaleX(.25)}}
.can{position:absolute;z-index:6;width:36px;height:30px;pointer-events:none;translate:-50% -50%;animation:can 1s ease-in-out forwards;transform-origin:70% 60%}
.can svg{width:100%;height:100%}
@keyframes can{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:rotate(-34deg)}80%{opacity:1;transform:rotate(-34deg)}100%{opacity:0;transform:rotate(0)}}
#stage .stems{filter:drop-shadow(14px 8px 10px rgba(20,28,40,.2))}
#stage .sw{animation:stsway 5.5s ease-in-out infinite}
@keyframes stsway{0%,100%{transform:rotate(-.6deg)}50%{transform:rotate(.6deg)}}
#stage .stem.in{animation:growin .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes growin{from{transform:scale(.12);opacity:0}}
#stage.dragging .sw{animation-play-state:paused}
.scroll{position:relative;display:inline-block;width:100%;max-width:290px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.25));text-align:left}
.scroll .rod{height:9px;margin:0 -7px;border-radius:5px;background:linear-gradient(#6b4a35,#3d2a1f);position:relative;z-index:1}
.scroll .mwrap{display:grid;grid-template-rows:1fr}
.scroll .mount{background:var(--silk);padding:12px 9px;overflow:hidden;min-height:0}
.scroll.unroll .mwrap{animation:unroll 1.1s cubic-bezier(.3,.7,.2,1)}
@keyframes unroll{from{grid-template-rows:0fr}}
.scroll .paper{position:relative;container-type:inline-size;overflow:hidden;outline:1px solid rgba(0,0,0,.1)}
.scroll .paper svg{display:block;width:100%}
.paper .stems{filter:drop-shadow(12px 7px 8px rgba(20,28,40,.18))}
.vt{position:absolute;top:5%;right:6%;writing-mode:vertical-rl;font-family:var(--f-display);font-size:8.4cqw;line-height:1.1;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.paper.dk .vt{color:#f1ece0}
.seal{display:inline-block;font-style:normal;font-size:.46em;line-height:1.08;letter-spacing:0;margin-top:.7em;padding:.4em .25em;background:#b5322c;color:#fff;border-radius:2px}
.work{background:none;padding:6px 6px 2px}
.works{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px}
.cf{position:absolute;left:50%;top:38%;width:10px;height:13px;border-radius:60% 60% 60% 60%/80% 80% 40% 40%;pointer-events:none;animation:pt 1.5s ease-out both}
.logo.big span{display:inline-block;animation:ink .9s both;animation-delay:calc(var(--i)*.2s)}
@keyframes ink{from{opacity:0;filter:blur(8px);transform:translateY(8px) scale(1.25)}}
@media (max-width:420px){.cot{width:84px;top:calc(33% - 48px);right:5%}}
@media (prefers-reduced-motion:reduce){.view,.grid>*,.works>*,.popin,#stage .sw,#stage .stem.in,.scroll.unroll .mwrap,.logo.big span,.bfly .wings{animation:none}.hills,.cot,.orb,.cloud{translate:none}}
.stagew{min-width:0}
@media (min-width:761px){
  .stage-col{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start}
  .trayw .sec{margin-top:0}
  .tray{flex-direction:column;overflow-y:auto;overflow-x:hidden;max-height:min(520px,calc(100vh - 300px));padding:2px 4px 2px 2px}
  .tray button{width:100%}
  #stage{width:min(100%,calc((100vh - 262px)*.93))}
}
@media (max-width:760px){.stage-col{display:flex;flex-direction:column}.trayw{order:2}}
@media (max-width:1000px){.studio{grid-template-columns:minmax(0,1fr)}}
@media (max-height:520px){#v-garden{overflow-y:auto;justify-content:flex-start}.g-space{flex:0 0 8px}.plots{width:min(100%,520px)}#stage{width:min(100%,400px);margin:0 auto}.tray{max-height:430px}}
/* ---------- v3: refined surfaces, signature motion ---------- */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--grain:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .13  0 0 0 0 .22  0 0 0 0 .23  0 0 0 .1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.sheet,.dialog{background-image:var(--grain)}
.sheet{position:relative;border-radius:22px;padding:22px 20px 20px;box-shadow:0 14px 40px var(--shadow),inset 0 1px 0 rgba(255,255,255,.7)}
.sheet::before,.dialog::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:16px;pointer-events:none}
.dialog{position:relative;padding:24px 22px 20px}
.h-title{font-size:28px;display:flex;align-items:center;gap:10px}
.h-title::after{content:"";width:8px;height:8px;background:var(--rouge);transform:rotate(45deg);flex-shrink:0}
.h-sub{letter-spacing:.04em}
h3.sec{letter-spacing:.14em;font-size:13px}
h3.sec::before{content:"";width:5px;height:5px;background:var(--ink);transform:rotate(45deg);flex-shrink:0}
.lvring{border-radius:50%;display:grid;place-items:center;transition:--p .5s}
.lvring span{border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tool.on{background:linear-gradient(#5f9f72,#467f58)}
.hint{letter-spacing:.06em}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.28)}}
/* cards: tilt, sheen, rarity */
.grid{perspective:900px}
.grid .card{background:linear-gradient(rgba(255,255,255,.86),rgba(255,255,255,.62));box-shadow:0 2px 8px rgba(20,40,40,.07),inset 0 1px 0 #fff;border-radius:16px;padding:12px 10px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .25s;overflow:hidden}
.grid .card:hover{box-shadow:0 12px 24px rgba(20,40,40,.16),inset 0 1px 0 #fff}
.grid .card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.7),transparent 46%);opacity:0;transition:opacity .3s;pointer-events:none}
.grid .card:hover::after{opacity:1}
.grid button.card:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
.grid .card.rr2{background:linear-gradient(rgba(255,255,255,.9),rgba(232,226,250,.75))}
.grid .card.rr3{border:1.5px solid transparent;background:linear-gradient(rgba(255,253,246,.94),rgba(255,244,232,.9)) padding-box,conic-gradient(from var(--ang),#f1c15a,#e87aa0,#8f7fe0,#5fc9c0,#f1c15a) border-box;animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both,foil 6s linear infinite;animation-delay:calc(var(--i,0)*35ms),0s}
@keyframes foil{to{--ang:360deg}}
.card .nm{font-size:14px;letter-spacing:.08em}
.rar{letter-spacing:.1em;padding:0 8px}
.tray button{background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.6));box-shadow:0 2px 6px rgba(20,40,40,.07),inset 0 1px 0 #fff}
.chip{letter-spacing:.04em}
/* petals unfurl layer by layer */
.popin .ly,.stem.in .ly,.big-ico .ly,.intro-fl .ly{animation:unfurl 1s cubic-bezier(.2,1.25,.4,1) both}
@keyframes unfurl{from{transform:scale(.1) rotate(-70deg);opacity:0}}
.intro-fl{height:120px;display:grid;place-items:end center;overflow:hidden;margin-bottom:-6px}
.intro-fl svg{width:210px;height:150px;overflow:visible}
.intro-fl .ly{animation-duration:1.5s}
/* flowers lean away from the pointer */
.pl>g:not(.x){transform:rotate(var(--lean,0deg));transition:transform .7s cubic-bezier(.2,1.9,.4,1)}
/* flying rewards */
.flyer{position:absolute;z-index:30;pointer-events:none;width:34px;height:44px;transform:translate(-50%,-50%);display:grid;place-items:center}
.flyer .ico{width:100%;height:100%}.flyer .coin{width:18px;height:18px}
.flyer .sd{width:12px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9a476,#7a5a3a);box-shadow:0 0 10px 3px rgba(255,255,255,.8)}
/* stage */
#stage{border-radius:18px;box-shadow:0 14px 34px var(--shadow),0 0 0 6px rgba(255,255,255,.55),0 0 0 7px var(--line)}
#stage .stem.settle{animation:settle .8s ease-out}
@keyframes settle{0%{transform:rotate(2.4deg)}28%{transform:rotate(-1.7deg)}55%{transform:rotate(1deg)}78%{transform:rotate(-.4deg)}100%{transform:rotate(0)}}
.rip{fill:none;stroke:#fff;stroke-width:1.5;animation:rip 1.3s ease-out forwards}
@keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(3.4);opacity:0}}
/* radar meter */
.meter2{display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.5));border-radius:16px;padding:8px 14px 8px 6px;box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(20,40,40,.06)}
.radar{width:136px;height:136px;flex-shrink:0;overflow:visible}
.radar text{font-size:10.5px;fill:var(--ink-soft);font-family:var(--f-body)}

/* ---------- v11: painted UI kit ---------- */
/* Painted UI chrome */
:root{--ink:#2b2a26;--ink-soft:#686052;--jade:#f7f0df;--jade-2:#e8dbc0;--rouge:#ad382e;--line:rgba(90,70,43,.23);--ui-shadow:drop-shadow(0 3px 5px rgba(66,46,28,.17))}
body{color:var(--ink)}

/* Rice-paper panels: the border contains the corner sprigs. */
.dialog,#v-codex .sheet,#v-gallery .sheet,#v-goals .sheet,.wstart,#v-wild .wstart,.talk{border-style:solid;border-color:transparent;border-width:28px;border-image:url('assets/ui_panel.webp') 80 fill / 28px stretch;background:none;border-radius:24px;padding:4px;box-shadow:none;filter:drop-shadow(0 9px 14px rgba(53,38,25,.24));backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);min-width:0}
.dialog{padding:6px;overscroll-behavior:contain}
.dialog::before,#v-codex .sheet::before,#v-gallery .sheet::before,#v-goals .sheet::before,.wstart::before,.talk::before{content:none;display:none}
#v-codex .sheet::after,#v-gallery .sheet::after,#v-goals .sheet::after{content:none;display:none}
#v-codex .sheet,#v-gallery .sheet,#v-goals .sheet{padding:6px 4px 8px}
#v-wild .wstart{padding:4px;gap:10px}
.wstart .wild-info{background:var(--jade) var(--grain) center/256px;padding:10px 10px 10px 14px;gap:8px;border:1px solid var(--line);border-radius:12px;box-shadow:0 -4px 10px -6px rgba(66,46,28,.18)}
.talk{padding:4px;gap:10px}
.dialog .say,.talk .say,.bubble,.ktip,.order .say,.folk .say{overflow-wrap:anywhere}

/* Small ivory cards. */
.grid .card,.grid .card.rr2,.grid .card.rr3,#v-shop .card,.tray button,.order,.folk,.wish,.finds>div,.wstart .finds>div,.pkc,.steps li,.insp:not(.idle),.st-finish,#v-shop .st-finish,.kpanel,.meter,.meter2,.bubble,.ktip,.st-pop,.st-detail,.chipx,.kfoot,.bdg,.tip-pop{--ui-edge:12px;border-style:solid;border-color:transparent;border-width:var(--ui-edge);border-image:url('assets/ui_card.webp') 40 fill / var(--ui-edge) stretch;background:none;border-radius:14px;padding:2px;box-shadow:none;filter:var(--ui-shadow);backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);min-width:0}
.grid .card,.grid .card.rr2,.grid .card.rr3,#v-shop .card{padding:2px 0 4px}
.grid .card::after{display:none}
.grid .card:hover{box-shadow:none;filter:drop-shadow(0 6px 9px rgba(66,46,28,.22))}
.grid .card.rr2{filter:drop-shadow(0 2px 5px rgba(115,86,107,.3))}
.grid .card.rr3{animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i,0)*35ms);filter:drop-shadow(0 0 5px rgba(210,157,57,.65)) drop-shadow(0 4px 7px rgba(117,74,23,.24))}
.grid .card.rr3:hover{filter:drop-shadow(0 0 8px rgba(222,168,64,.8)) drop-shadow(0 5px 9px rgba(117,74,23,.25))}
.tray button{--ui-edge:10px;padding:0;gap:2px}
.pkc{--ui-edge:10px;padding:0;line-height:1.4}
.pkc.on{background:none;box-shadow:none;color:#8b3028;filter:drop-shadow(0 0 2px rgba(173,56,46,.7)) drop-shadow(0 3px 4px rgba(66,46,28,.15))}
.order,.folk,.wish,.steps li,.insp:not(.idle),.st-finish,#v-shop .st-finish,.kpanel,.kfoot{padding:2px 4px}
.order .foot,.folk .foot{border-top-color:rgba(115,87,52,.24)}
.finds>div,.wstart .finds>div{padding:0;column-gap:6px}
.bubble{padding:2px 4px}
.ktip{padding:2px 4px 2px 34px}
.ktip::before{left:0;top:0;width:28px;height:28px;border-radius:4px;background:#ad382e;color:#fff6e4}
.st-pop{padding:2px 4px}
.st-detail,.meter2{padding:0 2px;gap:8px}
.chipx{--ui-edge:8px;min-height:36px;height:auto;padding:0 3px;gap:4px;line-height:1.25}
.chipx .bi{width:20px;height:20px}
#v-wild .walk-bot .chipx{height:36px;padding:0 2px;gap:3px}
.bdg{padding:2px 0;filter:grayscale(1) var(--ui-shadow)}
.bdg.on{background:none;filter:var(--ui-shadow)}

/* Compact controls use undecorated paper edges. */
.btn,.btn.primary,.btn.green,.btn.sm,.btn.lg,.chip,.hud-back,.ib,.st-quick button,.pill,.snd,.phase,.top .phase,.subnav button,.view .subnav button,.view .subnav button.on,.seg button,.ksteps button,.tray .tray-empty .btn{border-style:solid;border-color:transparent;border-width:8px;border-image:url('assets/ui_card.webp') 40 fill / 8px stretch;background:none;border-radius:9px;box-shadow:none;filter:drop-shadow(0 2px 3px rgba(66,46,28,.15));backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);line-height:1.2}
.btn,.btn.primary,.btn.green{padding:0 8px;letter-spacing:.03em}
.btn.sm{padding:0 5px;font-size:12px}
.btn.lg{padding:0 14px;font-size:15px}
.btn.green{color:#365644}
.btn:hover,.btn.primary:hover{box-shadow:none;filter:drop-shadow(0 3px 5px rgba(66,46,28,.25))}
.chip{padding:0 5px;gap:4px}
.hud-back{padding:0 4px;letter-spacing:0;gap:2px}
.st-quick button{padding:0 4px;gap:3px;letter-spacing:0}
.pill{padding:0 3px;gap:4px}
#bookBtn img{display:block;width:24px;height:24px;object-fit:contain;pointer-events:none}
.phase,.top .phase{padding:0 2px;min-height:30px;display:inline-flex;align-items:center}
.subnav,.view .subnav,.seg>div{background:none;border:0;box-shadow:none;filter:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.subnav button,.view .subnav button,.view .subnav button.on{padding:0 8px;letter-spacing:.06em}
.view .subnav{top:-58px;right:0;max-width:100%;gap:4px}
.seg>div{padding:0;gap:3px}
.seg button{min-width:0;padding:0 2px;letter-spacing:0}
.ksteps{flex-wrap:wrap;gap:4px}
.ksteps button{padding:0 4px;display:inline-flex;align-items:center;letter-spacing:.04em}
.ksteps .done{background:none;color:#365644}
.tray .tray-empty .btn{width:100%;height:auto;min-height:var(--c-md);padding:2px;white-space:normal;color:#8b3028;line-height:1.5}
.fin-act .btn{padding:0 4px;min-width:0;white-space:normal;line-height:1.3}
.inp,.stp>div{background:#faf5e9 var(--grain) center/256px;border-radius:8px;border:1px solid rgba(136,105,64,.36);box-shadow:inset 0 1px 3px rgba(90,64,31,.07);color:var(--ink)}
.stp button{color:#6c4c31}

/* Cinnabar lacquer: active controls and primary actions. */
.btn.primary,#dock .dock-tab.on,.subnav button.on,.view .subnav button.on,.seg button.on,.chip.on,.ksteps .on{border-style:solid;border-color:transparent;border-width:8px;border-image:url('assets/ui_btn_red.webp') 30 fill / 8px stretch;background:none;color:#fff6e4;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(113,43,29,.23));text-shadow:none}
#dock .dock-tab{border-style:solid;border-color:transparent;border-width:8px;border-image:url('assets/ui_card.webp') 40 fill / 8px stretch;background:none;border-radius:12px;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(66,46,28,.2));color:var(--ink)}
#app{--dock-room:calc(86px + env(safe-area-inset-bottom,0px))}
#app.walking{--dock-room:0px}
#dock{height:70px}
#dock .dock-tab{min-height:40px;min-width:40px;padding:0;gap:1px;font-size:15px;line-height:17px;letter-spacing:.04em}
#dock .dock-tab img{display:block;width:34px;height:34px;object-fit:contain;flex-shrink:0;pointer-events:none}
#dock .dock-dot{background:#b5322c;box-shadow:0 0 0 2px #fff2d6;top:1px;right:2px;z-index:1}

/* Porcelain tools and collectible medallions. */
.g-tools .tool,.g-tools .tool.on,.st-side button,.st-side button.on,.st-score,#witems .wi{border:0;border-image:none;border-radius:50%;background:url('assets/ui_round.webp') center/100% 100% no-repeat;box-shadow:none;filter:drop-shadow(0 3px 4px rgba(41,66,51,.22));backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink)}
.g-tools .tool{padding:4px;gap:1px;line-height:1.2}
.g-tools .tool.on,.st-side button.on{outline:2px solid #ad382e;outline-offset:-5px;color:#8b3028;filter:drop-shadow(0 0 4px rgba(186,131,47,.5))}
.g-tools .tool img{width:28px;height:28px}
.st-score::before{inset:5px;border-color:#688b7a;opacity:.35}

#witems .wi.rare{filter:drop-shadow(0 0 7px rgba(239,191,82,.85))}
.lvring{background:conic-gradient(#547f68 var(--p,0%),#e9dcc0 0);border:0;box-shadow:none;filter:drop-shadow(0 2px 3px rgba(41,66,51,.2))}
.lvring span{width:calc(100% - 8px);height:calc(100% - 8px);background:url('assets/ui_round.webp') center/100% 100% no-repeat;color:var(--ink)}

/* Wide painted plaques keep their decorated ends outside the text. */
.hint{width:min(100%,720px);min-height:46px;padding:10px clamp(64px,16vw,126px);background:url('assets/ui_btn_paper.webp') center/100% 100% no-repeat;border:0;border-image:none;border-radius:0;box-shadow:none;filter:var(--ui-shadow);backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--ink);line-height:1.65;letter-spacing:0;overflow-wrap:anywhere}
.st-head,.shop-head{min-height:62px;padding:8px 18%;background:url('assets/ui_btn_paper.webp') center/100% 100% no-repeat;border:0;border-image:none;border-radius:0;box-shadow:none;filter:var(--ui-shadow);align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 12px;color:var(--ink)}
.st-head .h-sub{min-width:0;margin:0;text-align:center;line-height:1.65;overflow-wrap:anywhere}
.shop-head .btn{padding:0 4px;max-width:100%;height:auto;min-height:var(--c-sm);white-space:normal}
#v-wild .walk-top{background:none;border:0;box-shadow:none;filter:none;padding:0;gap:12px}
#v-wild .walk-top .wstretch{width:160px;min-width:0;max-width:55%;min-height:44px;padding:9px 40px;background:url('assets/ui_btn_paper.webp') center/100% 100% no-repeat;border:0;border-image:none;border-radius:0;box-shadow:none;filter:var(--ui-shadow);font-size:19px;line-height:26px;white-space:nowrap;color:var(--ink)}
#v-wild .walk-top .wpath{min-width:0}

/* Silk title scrolls; the central field remains clear of decoration. */
.view .h-title,.dialog .center .h-title,.dialog .h-title.center{display:flex;align-items:center;justify-content:center;width:min(100%,320px);min-width:0;min-height:52px;padding:10px 72px;background:url('assets/ui_ribbon.webp') center/100% 100% no-repeat;border:0;border-radius:0;box-shadow:none;filter:drop-shadow(0 2px 3px rgba(66,46,28,.16));color:var(--ink);text-align:center;font-size:26px;line-height:1.3;gap:0;overflow-wrap:anywhere;text-shadow:none}
.h-title::after{content:none;display:none}
.dialog .center .h-title,.dialog .h-title.center{margin-inline:auto}
.st-head .h-title,.shop-head .h-title{width:240px;max-width:100%;padding-inline:54px;flex-shrink:1;font-size:25px}
.wstart .h-title{margin-inline:auto}

/* Mineral-pigment seals and quiet paper labels. */
.rar{display:inline-block;flex-shrink:0;border-radius:3px;padding:1px 6px;border:1px solid rgba(55,47,35,.16);font-size:10.5px;line-height:17px;letter-spacing:.06em;text-shadow:none}
.rar.r0{background:#c9d9c9;color:#2d4b3b;border-color:#8ba493}
.rar.r1{background:#d0d9de;color:#304d60;border-color:#8b9ea9}
.rar.r2{background:#ddd0d5;color:#654d59;border-color:#ae939e}
.rar.r3{background:#a43a2e;color:#ffe0a0;border-color:#cba158}
.req{border-radius:4px;background:#eadfc8;color:var(--ink)}
.req.ok{background:#d1dfcf;color:#2c4c38}
.ava,.card .card-tag{background:#a43a2e;color:#fff6e4}
.toast{background:#2b2a26 var(--grain) center/256px;background-blend-mode:multiply;color:#fff6e4;border:0;border-radius:5px;box-shadow:none;filter:drop-shadow(0 5px 7px rgba(43,32,23,.25));backdrop-filter:none;-webkit-backdrop-filter:none}
.pop:not(.rate){border-style:solid;border-color:transparent;border-width:6px;border-image:url('assets/ui_card.webp') 40 fill / 6px stretch;background:none;border-radius:7px;padding:0 3px;box-shadow:none;filter:var(--ui-shadow);color:var(--ink);text-shadow:none;max-width:calc(100% - 24px);white-space:normal;text-align:center;line-height:1.4}
.spot .tagw,.tb .tag,.hire{background:#f7f0df var(--grain) center/256px;border-color:rgba(136,105,64,.3);color:var(--ink)}
.npc.on .tag{background:#ad382e;color:#fff6e4}

/* Preserve the existing grids and scrolling regions at narrow widths. */
.grid{grid-template-columns:repeat(auto-fill,minmax(min(132px,100%),1fr))}
.works{grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr))}

.st-finish,#v-shop .st-finish,.kfoot{flex-wrap:wrap;gap:8px}

}

/* ---------- v13: unified interaction system ---------- */

       文字钮：高度取上面的档位
       方形图标钮：宽和高都取 --c-md（顶栏、关闭按钮）
       圆形工具钮：--c-round，图标加两个字，用在花畦工具和花艺台侧栏
   · 皮肤三种：纸（默认，ui_card）/ 朱漆（主操作、当前选中，ui_btn_red）/ 瓷（圆形工具钮，ui_round）

function needList(nd){const o=[];
  if(nd.give)for(const id in nd.give)o.push({t:`${F[id].n} ×${nd.give[id]}（有 ${cutOf(id)}）`,ok:cutOf(id)>=nd.give[id]});
  if(nd.bfly)o.push({t:`蝴蝶 ×${nd.bfly}（有 ${S.bfly}）`,ok:S.bfly>=nd.bfly});if(nd.dew)o.push({t:`露水 ×${nd.dew}（有 ${S.dew}）`,ok:S.dew>=nd.dew});
  if(nd.stat)o.push({t:`${nd.stat[2]}（已 ${Math.min(nd.stat[1],S.st[nd.stat[0]]||0)}）`,ok:(S.st[nd.stat[0]]||0)>=nd.stat[1]});
  if(nd.codex)o.push({t:`种开 ${nd.codex} 种花（已 ${blooms()}）`,ok:blooms()>=nd.codex});
  if(nd.work)o.push({t:'在花艺台完成并交付',ok:false});return o}

  if(w&&!has)S.orders.unshift({k:S.nid++,who:c.n,say:st.say,req:Object.assign({min:3},w),coins:0,exp:20,seed:null,story:c.id,lv})})}

  if(rw.seeds)for(const id in rw.seeds){gotSeed(id,rw.seeds[id]);out.push(`${F[id].n}花种 ×${rw.seeds[id]}`)}
  if(rw.vase){if(S.vases.includes(rw.vase)){S.coins+=100;out.push('100 花币')}else{S.vases.push(rw.vase);out.push(`花器「${VASES[rw.vase].n}」`)}}
  if(rw.bfly){S.bfly+=rw.bfly;out.push(`蝴蝶 ×${rw.bfly}`)}if(rw.dew){S.dew+=rw.dew;out.push(`露水 ×${rw.dew}`)}if(rw.clay){S.clay+=rw.clay;out.push(`陶土 ×${rw.clay}`)}
  if(rw.kiln){S.kiln=true;out.push('陶坊开放')}if(rw.legMax){S.legMax=rw.legMax;S.legs=rw.legMax;out.push('脚力上限 +1')}if(rw.deep){S.deep=1;out.push('山野深处开放')}
  if(rw.hint){S.rec[rw.hint]=1;out.push(`花谱里记下了${F[rw.hint].n}的亲本`)}return out}

function potPath(r,H){const n=r.length,cx=200,by=478,pts=r.map((q,i)=>[q,by-2-(H-2)*i/(n-1)]),Lf=pts.map(p=>[cx-p[0],p[1]]).reverse(),Rt=pts.map(p=>[cx+p[0],p[1]]);

  return{d:`M${cx-mw},${my}${sm(Lf)}Q${R(cx-r[0])},${by} ${R(cx-r[0]+6)},${by}L${R(cx+r[0]-6)},${by}Q${R(cx+r[0])},${by} ${R(cx+r[0])},${by-2}${sm(Rt)}A${mw},${R(mw*.2)} 0 0 1 ${cx-mw},${my}Z`,mw,my}}
function potVase(p,clayOnly){const g=potPath(p.r,p.H),id=p.id,ry=R(g.mw*.2),y=R(g.my+(478-g.my)*(1-p.py)),w0=120,w1=280,pg=p.pig;

   if(p.mo==='wave'){let d=`M${w0},${y}`;for(let x=w0;x<w1;x+=14)d+='q3.5,-7 7,0t7,0';ex+=`<path d="${d}"/><path d="${d}" transform="translate(0,8)" stroke-opacity=".5"/>`}
   if(p.mo==='dots')for(let k=-2;k<=2;k++){const x=200+k*26,yy=y+(k%2?6:0);ex+=[0,72,144,216,288].map(a=>`<circle cx="${R(x+Math.cos(a/DEG)*4.2)}" cy="${R(yy+Math.sin(a/DEG)*4.2)}" r="2.3" fill="${pg}" stroke="none"/>`).join('')}
   if(p.mo==='vine'){let d=`M${w0},${y}`;for(let x=w0;x<w1;x+=28)d+='q7,-9 14,0t14,0';ex+=`<path d="${d}"/>`;for(let x=w0+7,k=0;x<w1;x+=14,k++)ex+=`<path d="M${x},${y+(k%2?4:-4)}q5,-7 10,-3q-5,6 -10,3z" fill="${pg}" stroke="none"/>`}
   ex+='</g>'+(p.rim?`<path d="M${200-g.mw},${g.my}A${g.mw},${ry} 0 0 0 ${200+g.mw},${g.my}" fill="none" stroke="#d2ab45" stroke-width="2.6"/><g clip-path="url(#pc-${id})"><path d="M120,474H280" stroke="#d2ab45" stroke-width="3"/></g>`:'')}
