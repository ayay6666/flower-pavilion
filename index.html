/* Layout: one-screen game. A living sky-and-meadow scene sits behind everything; the garden beds
   stand directly on the meadow, the other rooms are jade-glass sheets, a tab rail runs along the bottom. */
:root{
  --jade:#eaf2ec; --jade-2:#d9e7de; --glass:rgba(238,246,241,.9);
  --ink:#22393a; --ink-soft:#587370; --line:rgba(34,57,58,.15);
  --rouge:#c4426a; --rouge-soft:#f6dbe4; --wisteria:#7f6bc4; --gamboge:#c98a1e; --leaf:#4f8f62;
  --soil:#7a5740; --silk:#ddd5c0; --white:#ffffff; --shadow:rgba(28,48,50,.18);
  --sky1:#bfe0ee; --sky2:#f4f3e2; --night:0;
  --f-display:"Ma Shan Zheng","STKaiti","KaiTi","Noto Serif SC",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--jade);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--wisteria);outline-offset:2px}
#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- scene ---------- */
.scene{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 58%)}
.stars{position:absolute;inset:0 0 45% 0;opacity:var(--night);
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,var(--white),transparent),radial-gradient(1px 1px at 28% 42%,var(--white),transparent),radial-gradient(1.4px 1.4px at 44% 12%,var(--white),transparent),radial-gradient(1px 1px at 58% 34%,var(--white),transparent),radial-gradient(1.3px 1.3px at 71% 16%,var(--white),transparent),radial-gradient(1px 1px at 86% 40%,var(--white),transparent),radial-gradient(1.2px 1.2px at 93% 10%,var(--white),transparent),radial-gradient(1px 1px at 6% 52%,var(--white),transparent),radial-gradient(1px 1px at 36% 62%,var(--white),transparent),radial-gradient(1.2px 1.2px at 66% 58%,var(--white),transparent)}
.orb{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);left:20%;top:20%}

/* ---------- v3: refined surfaces, signature motion ---------- */

.h-title{font-size:28px;display:flex;align-items:center;gap:10px}
.h-title::after{content:"";width:8px;height:8px;background:var(--rouge);transform:rotate(45deg);flex-shrink:0}
.h-sub{letter-spacing:.04em}
h3.sec{letter-spacing:.14em;font-size:13px}
h3.sec::before{content:"";width:5px;height:5px;background:var(--ink);transform:rotate(45deg);flex-shrink:0}
.lvring{border-radius:50%;display:grid;place-items:center;transition:--p .5s}
.lvring span{border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.tool.on{background:linear-gradient(#5f9f72,#467f58)}
.hint{letter-spacing:.06em}
.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.28)}}
/* cards: tilt, sheen, rarity */
.grid{perspective:900px}
.grid .card{background:linear-gradient(rgba(255,255,255,.86),rgba(255,255,255,.62));box-shadow:0 2px 8px rgba(20,40,40,.07),inset 0 1px 0 #fff;border-radius:16px;padding:12px 10px;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .25s ease-out,box-shadow .25s;overflow:hidden}
.grid .card:hover{box-shadow:0 12px 24px rgba(20,40,40,.16),inset 0 1px 0 #fff}
.grid .card::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.7),transparent 46%);opacity:0;transition:opacity .3s;pointer-events:none}
.grid .card:hover::after{opacity:1}
.grid button.card:hover{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-3px)}
.grid .card.rr2{background:linear-gradient(rgba(255,255,255,.9),rgba(232,226,250,.75))}
.grid .card.rr3{border:1.5px solid transparent;background:linear-gradient(rgba(255,253,246,.94),rgba(255,244,232,.9)) padding-box,conic-gradient(from var(--ang),#f1c15a,#e87aa0,#8f7fe0,#5fc9c0,#f1c15a) border-box;animation:cardin .5s cubic-bezier(.2,.9,.3,1.2) both,foil 6s linear infinite;animation-delay:calc(var(--i,0)*35ms),0s}
@keyframes foil{to{--ang:360deg}}
.card .nm{font-size:14px;letter-spacing:.08em}
.rar{letter-spacing:.1em;padding:0 8px}
.tray button{background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,.6));box-shadow:0 2px 6px rgba(20,40,40,.07),inset 0 1px 0 #fff}
.chip{letter-spacing:.04em}
/* petals unfurl layer by layer */
.popin .ly,.stem.in .ly,.big-ico .ly,.intro-fl .ly{animation:unfurl 1s cubic-bezier(.2,1.25,.4,1) both}
@keyframes unfurl{from{transform:scale(.1) rotate(-70deg);opacity:0}}
.intro-fl{height:120px;display:grid;place-items:end center;overflow:hidden;margin-bottom:-6px}
.intro-fl svg{width:210px;height:150px;overflow:visible}
.intro-fl .ly{animation-duration:1.5s}
/* flowers lean away from the pointer */
.pl>g:not(.x){transform:rotate(var(--lean,0deg));transition:transform .7s cubic-bezier(.2,1.9,.4,1)}
/* flying rewards */
.flyer{position:absolute;z-index:30;pointer-events:none;width:34px;height:44px;transform:translate(-50%,-50%);display:grid;place-items:center}
.flyer .ico{width:100%;height:100%}.flyer .coin{width:18px;height:18px}
.flyer .sd{width:12px;height:17px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c9a476,#7a5a3a);box-shadow:0 0 10px 3px rgba(255,255,255,.8)}
/* stage */
#stage{border-radius:18px;box-shadow:0 14px 34px var(--shadow),0 0 0 6px rgba(255,255,255,.55),0 0 0 7px var(--line)}
#stage .stem.settle{animation:settle .8s ease-out}
@keyframes settle{0%{transform:rotate(2.4deg)}28%{transform:rotate(-1.7deg)}55%{transform:rotate(1deg)}78%{transform:rotate(-.4deg)}100%{transform:rotate(0)}}
.rip{fill:none;stroke:#fff;stroke-width:1.5;animation:rip 1.3s ease-out forwards}
@keyframes rip{from{transform:scale(.4);opacity:.9}to{transform:scale(3.4);opacity:0}}
/* radar meter */
.meter2{display:flex;align-items:center;gap:12px;background:linear-gradient(rgba(255,255,255,.8),rgba(255,255,255,.5));border-radius:16px;padding:8px 14px 8px 6px;box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(20,40,40,.06)}
.radar{width:136px;height:136px;flex-shrink:0;overflow:visible}
.radar text{font-size:10.5px;fill:var(--ink-soft);font-family:var(--f-body)}
.radar .rv{transition:all .4s}
.mscore{min-width:0}
.mscore b{font-size:40px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--f-body)}
.mscore small{font-size:12px;color:var(--ink-soft);margin-left:6px;letter-spacing:.2em}
.mscore .rate{font-size:14px}
.mscore p{margin:4px 0 0;font-size:12.5px;color:var(--ink-soft);line-height:1.5}
/* orders as letter slips */
.order{background:#fffdf6 var(--grain);border-radius:4px 16px 16px 4px;padding:12px 14px 10px 16px;position:relative;box-shadow:0 2px 8px rgba(20,40,40,.08);border-left:3px solid var(--rouge)}
.order .who{display:flex;align-items:center;gap:8px;letter-spacing:.08em}
.ava{width:26px;height:26px;border-radius:50%;background:var(--rouge);color:var(--white);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;line-height:1;flex-shrink:0}
.order .say{font-size:13.5px;line-height:1.7;margin:6px 0 8px}
.order .foot{border-top:1px dashed var(--line);padding-top:8px;margin-top:6px}
/* finishing ceremony */
.scroll.unroll .vtn{animation:fadein .9s .8s both}
.scroll.unroll .seal{animation:stamp .5s 1.25s cubic-bezier(.3,1.7,.5,1) both}
@keyframes stamp{from{transform:scale(2.8) rotate(-16deg);opacity:0}}
.rate i{font-style:normal;display:inline-block}
.rate.pop i{animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both;animation-delay:calc(1.3s + var(--i)*.13s)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg);opacity:0}}
.reveal{position:relative;display:grid;place-items:center}
.reveal .rays{position:absolute;width:260px;height:260px;border-radius:50%;background:repeating-conic-gradient(rgba(255,214,120,.5) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 68%);mask:radial-gradient(circle,#000 10%,transparent 68%);animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal .ico{position:relative}
.toast{background:rgba(28,48,50,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);letter-spacing:.05em;padding:8px 18px}
.shoot{position:absolute;top:10%;left:74%;width:110px;height:1.5px;background:linear-gradient(90deg,#fff,transparent);opacity:0;rotate:-22deg;animation:shoot 11s linear infinite}
@keyframes shoot{0%,90%{opacity:0;translate:0 0}91%{opacity:var(--night)}100%{opacity:0;translate:-300px 120px}}
.plot .pinfo{box-shadow:0 1px 4px rgba(20,40,40,.12);letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.popin .ly,.stem.in .ly,.big-ico .ly,.intro-fl .ly,.tab.on svg,.bump,#stage .stem.settle,.scroll.unroll .seal,.scroll.unroll .vtn,.rate.pop i,.reveal .rays,.shoot,.grid .card.rr3{animation:none}.pl>g{transition:none}.tabs .ind{transition:none}}
/* ---------- v4: garden scene — ink-wash ridges, painted lawn, stone-ringed beds ---------- */
#app{--hz:240px}
.stars{inset:0 0 auto 0;height:var(--hz)}
.c1{top:calc(var(--hz)*.2)}.c2{top:calc(var(--hz)*.46)}.c3{top:calc(var(--hz)*.05)}
.bow{top:auto;bottom:calc(100% - var(--hz) - 50px);width:min(150vmin,1300px)}
.mtn{position:absolute;left:-3%;width:106%;bottom:calc(100% - var(--hz) - 14px);height:clamp(110px,27vh,240px);translate:calc(var(--px,0)*-14px) calc(var(--py,0)*-5px);transition:translate .5s ease-out}
.mist{position:absolute;left:-6%;right:-6%;top:calc(var(--hz) - 52px);height:92px;background:radial-gradient(60% 100% at 28% 50%,rgba(255,255,255,.8),transparent 70%),radial-gradient(50% 90% at 76% 58%,rgba(255,255,255,.65),transparent 70%);opacity:calc(.9 - var(--night)*.5);animation:mist 26s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(4%)}}
#gnd{position:absolute;left:-4%;width:108%;top:calc(var(--hz) - 8px);height:calc(100% - var(--hz) + 8px);border-radius:50% 50% 0 0/28px 28px 0 0}
.cot{right:7%;top:auto;bottom:calc(100% - var(--hz) - 22px);width:150px}
.smk{animation:smoke 5.5s ease-out infinite;opacity:0;transform-origin:87px 26px}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:.65}100%{transform:translate(12px,-30px) scale(2.3);opacity:0}}
.bough{position:absolute;right:-8px;top:-6px;width:min(50vw,440px);pointer-events:none;transform-origin:100% 0;animation:boughsway 8s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(30,40,50,.2));overflow:visible}
@keyframes boughsway{0%,100%{rotate:-1.3deg}50%{rotate:1.3deg}}
.fgl,.fgr{position:absolute;bottom:-50px;width:min(34vw,260px);filter:blur(2.6px);pointer-events:none;opacity:.92;overflow:visible}
.fgl{left:-40px}.fgr{right:-40px;scale:-1 1}
.plots{gap:0 8px;filter:brightness(calc(1 - var(--night)*.22)) saturate(calc(1 - var(--night)*.12))}
.plot{scale:var(--ps,1);transform-origin:50% 86%}
.plot:nth-child(-n+4){--ps:.86}.plot:nth-child(n+5):nth-child(-n+8){--ps:.93}
.plot .pinfo{height:19px;margin-top:-5px;padding:0 8px;border-radius:3px;background:linear-gradient(#f3e8cf,#d9c6a1);color:#4b3a27;font-size:11px;box-shadow:0 2px 3px rgba(30,30,20,.3),inset 0 1px 0 rgba(255,255,255,.65)}
.plot:nth-child(odd) .pinfo{rotate:-2deg}.plot:nth-child(even) .pinfo{rotate:1.6deg}
.plot .pbar{width:24px;height:3px;background:rgba(75,58,39,.22)}
.plot.empty .pinfo,.plot.locked .pinfo{background:rgba(255,255,255,.26);color:#fff;box-shadow:none;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.plot.bloom .pinfo{background:linear-gradient(#fce6ec,#f0b9ca);color:#8a2346}
.plot.dry .soil{fill:#a98a6b}
.plot.locked svg{opacity:.5;filter:grayscale(.65)}
.plot.bloom::after{content:"";position:absolute;left:66%;top:20%;width:13px;height:13px;background:#fff;clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:twinkle 1.9s ease-in-out infinite;pointer-events:none}
.plot.bloom:nth-child(even)::after{left:24%;top:30%;animation-delay:-.9s}
@keyframes twinkle{0%,100%{transform:scale(.2);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.badge{top:16%}
@media (max-width:420px){.cot{width:74px;right:2%;bottom:calc(100% - var(--hz) + 30px)}}
@media (prefers-reduced-motion:reduce){.mist,.smk,.bough,.plot.bloom::after{animation:none}.mtn{translate:none}}

/* ---------- v6: studio as a workbench; controls grouped by purpose ---------- */
.st-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}.st-head .h-sub{margin:0}
.stagew{position:relative;width:min(100%,calc((100vh - 350px)*.93));margin:0 auto}
.stagew #stage{width:100%;margin:0}
@media (max-width:760px){.stagew{width:min(100%,calc(56vh*.93))}}
@media (max-height:520px){.stagew{width:min(100%,400px)}}
.st-score{position:absolute;left:12px;top:12px;width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.84);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 12px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.8);display:grid;place-content:center;justify-items:center;line-height:1;z-index:2;transition:transform .15s}
.st-score:active{transform:scale(.94)}
.st-score::before{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--wisteria);opacity:.4}
.st-score[data-lv="4"]::before{opacity:.8}.st-score[data-lv="5"]::before{border-color:var(--gamboge);opacity:1}
.st-score b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.st-score i{font-style:normal;font-size:9.5px;letter-spacing:.2em;color:var(--ink-soft);margin:3px 0 0 2px}
.st-detail,.st-pop{position:absolute;z-index:3;background:rgba(248,251,249,.97);border-radius:16px;box-shadow:0 12px 30px var(--shadow),inset 0 0 0 1px rgba(255,255,255,.8);animation:popin2 .22s ease}
@keyframes popin2{from{opacity:0;transform:translateY(-6px)}}
.st-detail{left:12px;top:80px;width:min(310px,calc(100% - 76px));padding:8px 12px 10px 4px;display:flex;gap:6px;align-items:center}
.st-detail .radar{width:118px;height:118px}
.st-detail .mscore{flex:1}
.st-detail ul{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;font-size:9.5px;color:var(--ink-soft)}
.st-detail li b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.st-side{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
.st-side button{display:grid;place-items:center;color:var(--ink);transition:transform .15s,background .2s,color .2s}
.st-side button svg{width:19px;height:19px}
.st-side button.on{background:var(--ink);color:var(--jade)}
.st-side button:active{transform:scale(.92)}
.st-side .gap{height:6px}
.st-pop{right:62px;top:12px;width:min(252px,calc(100% - 78px));padding:10px 12px 12px}
.st-pop h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.24em;color:var(--ink-soft);font-weight:600}
.st-pop p{margin:8px 0 0;font-size:11.5px;color:var(--ink-soft)}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px}
.pkc{border-radius:12px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;box-shadow:inset 0 0 0 1px var(--line);background:rgba(255,255,255,.6);transition:transform .15s}
.pkc:active{transform:scale(.95)}
.pkc svg{width:42px;height:46px}
.pkc .sw{width:42px;height:46px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line)}
.pkc.on{box-shadow:inset 0 0 0 2px var(--rouge);background:var(--white)}
.insp{margin-top:12px;background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.58));border-radius:16px;padding:10px 12px 12px;box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(20,40,40,.06);min-height:48px}
.insp.idle{display:grid;place-items:center;background:none;box-shadow:none;padding:6px}
.insp-tip{font-size:12.5px;color:var(--ink-soft);text-align:center;letter-spacing:.04em;line-height:1.6}
.insp-h{display:flex;align-items:center;gap:8px}
.insp-h b{font-size:15px;letter-spacing:.1em}.insp-h>i{flex:1}
.ib{display:grid;place-items:center;transition:transform .15s}
.ib svg{width:16px;height:16px}.ib:active{transform:scale(.9)}
.insp-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.stp label,.seg label{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--ink-soft);margin:0 0 3px 10px}
.stp>div{display:flex;align-items:center;height:34px;border-radius:99px;background:var(--white);box-shadow:inset 0 0 0 1px var(--line)}
.stp button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.stp button svg{width:13px;height:13px}.stp button:active{background:var(--jade-2)}
.stp span{flex:1;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:0}
.seg{grid-column:1/-1}
.seg>div{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg button{border-radius:99px;font-size:12px;letter-spacing:.06em;transition:background .2s,color .2s}
.seg button.on{background:var(--ink);color:var(--jade)}
@media (min-width:1001px){.insp-g{grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.35fr)}.insp-g .seg{grid-column:auto}}
.st-finish{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.55));border-radius:18px;padding:10px 10px 10px 18px;box-shadow:inset 0 1px 0 #fff,0 2px 8px rgba(20,40,40,.06)}
#stCount{font-size:12.5px;color:var(--ink-soft);letter-spacing:.06em}
.trayw .sec{display:none}
@media (max-width:760px){.trayw{margin-top:10px}}
@media (max-width:1000px){.side-col{margin-top:2px}#orders{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px}#orders .order{flex:0 0 min(86%,340px);scroll-snap-align:start;margin:0}}
.g-tools{gap:14px}
.g-tools .tool{flex-direction:column;justify-content:center;padding:0;gap:2px;font-size:10.5px;letter-spacing:0}
.g-tools .tool svg{width:20px;height:20px}

/* ---------- v7: wild walks, neighbours, wishes, pottery ---------- */
.subnav{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:99px;background:rgba(255,255,255,.7);box-shadow:inset 0 0 0 1px var(--line);margin-bottom:14px}
.subnav button{font-size:13px;letter-spacing:.14em;color:var(--ink-soft);transition:background .2s,color .2s}
.chipx{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 8px;border-radius:99px;background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.chipx b{font-variant-numeric:tabular-nums}
.bi{width:24px;height:24px;display:inline-grid;place-items:center;flex-shrink:0}
.bi svg{width:100%;height:100%;overflow:visible}
.bag{display:flex;gap:8px;flex-wrap:wrap}
.pano{position:relative;height:min(46vh,340px);border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2) 70%);box-shadow:0 10px 26px var(--shadow),0 0 0 6px rgba(255,255,255,.55),0 0 0 7px var(--line)}
.pano::after{content:"";position:absolute;inset:0;background:#141a44;opacity:calc(var(--night)*.42);pointer-events:none}
#witems{position:absolute;inset:0;z-index:1}
.wi{position:absolute;left:104%;width:66px;height:66px;display:grid;place-items:center;transform:translate(-50%,-50%);border-radius:50%}
.wi svg{width:36px;height:36px;overflow:visible;filter:drop-shadow(0 2px 5px rgba(30,50,50,.25))}
.wi.k-bfly svg{animation:bob2 1.6s ease-in-out infinite}
.wi.k-seed svg{width:44px;height:44px;animation:bob2 2.6s ease-in-out infinite}
.wi.rare svg{filter:drop-shadow(0 0 8px #ffe9a0) drop-shadow(0 0 3px #fff)}
.wi.k-dew svg{width:26px;height:30px;animation:glint 1.8s ease-in-out infinite}
@keyframes glint{50%{filter:drop-shadow(0 0 7px #fff) brightness(1.15)}}
.wi.k-flower svg{width:44px;height:58px}
.wi:active{transform:translate(-50%,-50%) scale(.9)}
.walk{position:relative}
.walk .pano{height:min(56vh,440px)}
.walk-top{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-soft);letter-spacing:.14em}
.wpath{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--ink-soft) 0 6px,transparent 6px 12px);position:relative;opacity:.8}
.wpath i{position:absolute;top:-7px;left:0;width:16px;height:16px;border-radius:50%;background:var(--rouge);border:3px solid var(--white);transform:translateX(-50%);transition:left .4s linear;box-shadow:0 2px 5px var(--shadow)}
.walk-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.walk-tip{text-align:center;font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;letter-spacing:.08em}
.wild-card{display:grid;gap:12px}
.wild-info{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.legs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.legs i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--leaf)}
.legs i.on{background:var(--leaf)}
.legs span{margin-left:6px}
.finds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.finds>div{display:grid;grid-template-columns:34px 1fr;column-gap:10px;align-items:center;background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px}
.finds .bi{grid-row:span 2;width:32px;height:32px}
.finds b{font-size:13.5px;letter-spacing:.08em}.finds small{font-size:11.5px;color:var(--ink-soft);line-height:1.45}
.folks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.folk{background:#fffdf6 var(--grain);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(20,40,40,.08);display:flex;flex-direction:column;gap:8px}
.fh{display:flex;gap:12px;align-items:center}
.fh b{font-size:16px;letter-spacing:.12em}.fh small{margin-left:8px;font-size:11.5px;color:var(--ink-soft)}
.ava.big{width:46px;height:46px;font-size:26px}
.hearts{display:flex;gap:5px;margin-top:5px}

#v-wild .walk-top{position:absolute;top:64px;left:16px;right:16px;margin:0;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.78);z-index:2}

#v-town{padding:0;overflow:hidden}

.street{position:absolute;left:-6%;right:-6%;top:calc(var(--hz) + 9%);height:19%;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#f3e8d1,#dccdae);opacity:.92;box-shadow:inset 0 -6px 14px rgba(120,90,50,.18)}
.tb{position:absolute;left:var(--x);top:var(--y);width:max-content;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:transform .2s}

.npc::before{content:"";position:absolute;left:50%;bottom:16px;width:calc(min(54px,7vh)*var(--d,1));height:12px;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(70,50,30,.32),transparent);z-index:-1}
/* shop signs hang above the roof, where no one can stand in front of them */
.bld .tag{order:-1;margin:0 0 3px}
.tb:hover{transform:translate(-50%,-100%) translateY(-4px)}
.tb:active{transform:translate(-50%,-100%) scale(.96)}
.chibi{display:block;overflow:visible}
.npc .chibi{width:calc(min(68px,9vh)*var(--s,1)*var(--d,1));animation:bobc 2.8s ease-in-out infinite}
.npc:nth-of-type(odd) .chibi{animation-delay:-1.3s}
@keyframes bobc{50%{transform:translateY(-3px)}}
.tb .tag{font-size:12px;letter-spacing:.1em;padding:1px 9px;border-radius:99px;background:rgba(255,255,255,.9);box-shadow:0 2px 6px var(--shadow);margin-top:2px;white-space:nowrap}
.npc.on .tag{background:var(--ink);color:var(--jade)}
.bub{position:absolute;top:-8px;right:-6px;min-width:30px;height:21px;padding:0 7px;border-radius:10px;background:#fffaf0;color:var(--ink);box-shadow:0 1px 3px rgba(73,47,29,.3);display:grid;place-items:center;font-style:normal;font-size:13px;line-height:1;font-family:var(--f-display);animation:bob 1.6s ease-in-out infinite;z-index:1}
.bub.ok{
  top:-5px;right:-8px;width:24px;min-width:0;height:17px;padding:0;
  border:1px solid #966e47;border-radius:3px 2px 3px 2px;
  background:linear-gradient(165deg,#fff5dd,#e7cda3);
  box-shadow:0 2px 3px rgba(73,47,29,.22);transform:rotate(-8deg);animation:none
}
.bub.ok::before{
  content:"";position:absolute;inset:1px 1px 3px;background:#b59063;
  clip-path:polygon(0 0,50% 67%,100% 0,100% 10%,50% 80%,0 10%)
}
.bub.ok::after{
  content:"";position:absolute;top:6px;left:calc(50% - 3px);width:6px;height:6px;
  border-radius:48% 43% 46% 40%;background:#a34839;box-shadow:inset 0 1px 1px #cb8060
}
.bub.done{color:#ad382e;animation:none}
/* 对话泡带一根小尾巴指向说话的人，不做成圆片（圆片像通知红点）；信封泡（.ok）是另一种形状，不加尾巴 */
.bub:not(.ok)::before{content:"";position:absolute;left:6px;bottom:-5px;width:8px;height:6px;background:inherit;clip-path:polygon(0 0,100% 0,10% 100%)}
.bub svg{display:block;width:13px;height:13px}
@media (max-width:700px){.tb{left:var(--xm);top:var(--ym)}.npc{z-index:var(--zm)}.npc::before{width:calc(min(46px,6vh)*var(--dm,1))}.npc .chibi{width:calc(min(50px,6.5vh)*var(--s,1)*var(--dm,1))}}
.talk{position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(94%,560px);display:flex;gap:12px;align-items:flex-end;background:#fffdf6 var(--grain);border-radius:22px;padding:14px 16px 14px 10px;box-shadow:0 14px 34px rgba(20,40,40,.3),inset 0 0 0 2px rgba(255,255,255,.8);z-index:4;animation:talkin .3s cubic-bezier(.2,1.3,.4,1)}
/* 小镇是一张比屏幕大的地图：铺满整个页面，顶栏和底栏浮在画上；拖动、双指缩放着看（镜头见 layoutTown）。
   人物按站位给的 z-index（几十）只在整图内部比前后，isolation 把整图关成一层，对话框（.talk）才能盖在所有人物上面 */
.tscroll{position:absolute;inset:0 0 calc(-1*var(--dock-room));isolation:isolate;z-index:0;overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tscroll.grab,.tscroll.grab *{cursor:grabbing}
/* 只在图片还没载入的一瞬间露出宣纸 */
#app[data-at=town] .scene{background:#efe5cf var(--grain) center/384px}
.tscroll::-webkit-scrollbar{display:none}
.tworld{position:absolute;left:0;top:0;container-type:size;will-change:transform}
.tplate{position:absolute;inset:0;width:100%;height:100%;max-width:none}
/* 小镇是俯视的一整张画，不再叠在平视的远山、草地和角花上；夜色和雨天照样罩在画上 */
#app[data-at=town] .scene>:not(#fx){display:none}
.tworld::after,.tworld::before{content:"";position:absolute;inset:calc(-1*var(--bt,0%)) calc(-1*var(--br,0%)) calc(-1*var(--bb,0%)) calc(-1*var(--bl,0%));pointer-events:none;z-index:300}
/* 带出血的整图：.tworld 只是中间的安全区（坐标、人物都按它算），底图向四周多出一圈画（--bl/--bt/--br/--bb，安全区宽高的百分比），
   夜色雨幕跟着底图一起铺开 */
.tworld.bleed .tplate{left:calc(-1*var(--bl));top:calc(-1*var(--bt));width:calc(100% + var(--bl) + var(--br));height:calc(100% + var(--bt) + var(--bb))}
.tworld::after{background:#141a44;opacity:calc(var(--night,0)*.46)}
.tworld::before{background:#5d7186;opacity:0;transition:opacity 2s}.rain .tworld::before{opacity:.32}
.tspot{position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h);padding:0;border:0;background:none;border-radius:18px;cursor:pointer;z-index:1}
.tspot:focus-visible,.tfig:focus-visible{outline:none}
/* 房子和人物被选中（Tab 键，或关掉对话框后焦点回到它身上）时，不在画上画红框：房子底下泛一团暖光，人物身上泛一圈柔光 */
.tspot:focus-visible{background:radial-gradient(closest-side,rgba(255,244,200,.42),rgba(255,244,200,.16) 60%,transparent)}
.tfig:focus-visible{filter:drop-shadow(0 0 5px rgba(255,246,206,.95)) drop-shadow(0 0 2px #fff)}
/* 画上不写地名：花铺、沈记书店的招牌本来就画在图里，其余房子不叠任何牌子或纸签（压在画上都出戏）。
   人名、「门还关着」也不浮在画上：点人物、点房子，对话框里有名字；陶坊关着门会说明怎么开。读屏从 aria-label 读到 */
.tspot .bub{top:-15px;right:-17px}
.tfig{position:absolute;left:var(--fx);top:var(--fy);height:max(var(--fh),56px);translate:-50% -100%;padding:0;border:0;background:none;display:block;cursor:pointer}
.tfig.still{pointer-events:none}
/* 小人画得窄（手机竖屏只有十几像素宽），手指点的范围至少放到 48px 宽，上下也多留一点；看起来不变 */
.tfig::after{content:"";position:absolute;left:50%;top:-8px;bottom:-10px;width:max(100% + 16px,48px);translate:-50% 0}

#v-studio #stage{width:100%;margin:0}
@media (min-height:560px){
  #v-studio{overflow:hidden;display:flex;flex-direction:column}
  #v-studio .sheet{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;padding:2px 0 0}
  #v-studio .studio{flex:1;min-height:0}
  #v-studio .stage-col{height:100%;min-height:0}
  #v-studio .stagew{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
  #v-studio .stage-box{width:min(100%,max(200px,calc((100vh - 330px)*.93)));width:min(100%,max(200px,calc((100dvh - 330px)*.93)))}
  @supports (width:1cqh){#v-studio .stage-box{width:min(100cqw,calc(100cqh*.9285))}}
}
.st-side{top:10px;right:10px;gap:6px}
.st-side button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;line-height:1;letter-spacing:.04em}
.st-side button svg{width:16px;height:16px}
.st-side .dot{position:absolute;top:-2px;right:-2px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:#b5322c;color:#fff6e4;font-size:10.5px;line-height:17px;font-style:normal;text-align:center}
.st-pop{right:64px;max-height:calc(100% - 22px);overflow-y:auto}
.st-tip{position:absolute;left:0;right:0;bottom:8px;z-index:1;width:fit-content;max-width:calc(100% - 16px);margin:0 auto;padding:3px 10px;border-radius:12px;background:rgba(249,243,229,.88);color:var(--ink);font-size:11.5px;line-height:1.45;text-align:center;pointer-events:none}
.st-tip:empty{display:none}
.st-deck{display:flex;flex:0 0 auto;height:96px}
.st-tabs{display:flex;flex-direction:column;gap:4px;flex:0 0 30px}
.st-tabs button{flex:1;display:grid;place-items:center;writing-mode:vertical-rl;font-family:var(--f-display);font-size:14px;letter-spacing:.14em;border:1px solid var(--line);border-right:0;border-radius:9px 0 0 9px;background:#eadfc6;color:var(--ink-soft)}
.st-tabs button.on{background:var(--rouge);border-color:var(--rouge);color:#fff6e4}
.st-tabs button.dim{opacity:.55}
.st-panel{position:relative;flex:1;min-width:0;border:1px solid var(--line);border-radius:0 10px 10px 0;background:rgba(249,243,229,.78)}
.st-panel>*{position:absolute;inset:0}
.st-deck[data-mode=stem] .trayw,.st-deck[data-mode=tray] .insp{visibility:hidden;pointer-events:none}
#v-studio .trayw{margin:0;order:0}
#v-studio .tray{flex-direction:row;align-items:center;gap:6px;height:100%;max-height:none;padding:0 8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x}
#v-studio .tray::-webkit-scrollbar{display:none}
#v-studio .tray button{position:relative;flex:0 0 auto;width:66px;gap:0;font-size:11px;line-height:1.3;touch-action:pan-x}
#v-studio .tray .ico{width:40px;height:48px}
#v-studio .tray button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-studio .tray b{position:absolute;top:-8px;right:-8px;min-width:19px;height:17px;padding:0 4px;border-radius:9px;background:var(--rouge);color:#fff6e4;font-size:10.5px;font-weight:600;line-height:17px;text-align:center}
#v-studio .tray-empty{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
#v-studio .tray .tray-empty .btn{width:auto;padding:2px 6px}
#v-studio .insp{display:flex;flex-direction:column;justify-content:center;gap:6px;margin:0;padding:5px 8px;min-height:0;border:0;border-image:none;border-radius:0;background:none;box-shadow:none;filter:none}
#v-studio .insp-h{flex-wrap:nowrap;gap:6px;min-width:0}
#v-studio .insp-h b{min-width:0;font-size:15px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#v-studio .insp-g{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:6px;margin:0}
#v-studio .stp,.cyc{display:flex;align-items:center;height:38px;min-width:0;border-radius:8px;background:#faf5e9;border:1px solid rgba(136,105,64,.36);font-size:12.5px;line-height:1.15;color:var(--ink)}
#v-studio .stp button{width:30px;height:36px;flex-shrink:0;border-radius:8px}
#v-studio .stp span,.cyc{flex-direction:column;justify-content:center;white-space:nowrap}
#v-studio .stp span{flex:1;min-width:0;display:flex;align-items:center}
.cyc{flex:0 0 auto;min-width:40px;padding:0 4px}
#v-studio .insp-h b{flex-shrink:0;max-width:calc(100% - 210px)}
/* a head flower in full bloom shows three switches (花期, 朝向, 弯形); on a phone the role chip gives way and the name shrinks */
#v-studio .insp-h:has(>.cyc~.cyc~.cyc) .rar{display:none}
#v-studio .insp-h:has(>.cyc~.cyc~.cyc) b{flex-shrink:1;letter-spacing:0;max-width:none}
#v-studio .insp-h>i{min-width:0}
.cyc:active{background:var(--jade-2)}
#v-studio .stp small,.cyc small{font-size:9.5px;letter-spacing:.12em;color:var(--ink-soft)}
.st-bar{display:flex;align-items:center;gap:6px;flex:0 0 auto}
#v-studio .st-quick{position:static;display:flex;flex-wrap:nowrap;gap:4px;min-width:0}
#v-studio .st-quick button{padding:0 3px;gap:3px;font-size:12px;white-space:nowrap}
#stCount{margin-left:auto;font-size:12px;color:var(--ink-soft);white-space:nowrap}
#finishArr{flex-shrink:0}
@media (max-width:480px){#stCount{display:none}#finishArr{margin-left:auto}}
.so-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.so-head .sec{margin:0 0 8px}
@media (min-width:1001px){
  #v-studio .studio{grid-template-columns:minmax(0,1fr) minmax(280px,360px)}
  .side-col{min-width:0;min-height:0;overflow-y:auto}
  .so-x,.st-side .so-btn{display:none}
}
@media (max-width:1000px){
  .side-col{position:fixed;z-index:7;left:12px;right:12px;top:62px;bottom:calc(var(--dock-room) + 6px);display:none;flex-direction:column;margin:0;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--jade) var(--grain) center/384px;box-shadow:0 12px 34px rgba(53,38,25,.35)}
  .studio.orders-open .side-col{display:flex}
  #orders{display:block;flex:1;min-height:0;overflow-y:auto;padding:2px;scroll-snap-type:none}
  #orders .order{flex:none;margin:0 0 8px}
}
#app{--dock-room:calc(76px + env(safe-area-inset-bottom,0px))}
#dock{height:60px;gap:2px;padding:4px;border:1px solid var(--line);border-radius:18px;background:#f7f0df var(--grain) center/256px;box-shadow:0 4px 14px rgba(66,46,28,.22)}
#dock .dock-tab,#dock .dock-tab.on{border:0;border-image:none;border-radius:13px;background:none;box-shadow:none;filter:none;gap:2px;font-size:13px;line-height:15px;color:var(--ink-soft)}
#dock .dock-tab svg{width:24px;height:24px}
#dock .dock-tab.on{background:var(--rouge);color:#fff6e4}
#dock .dock-dot{top:5px;right:calc(50% - 19px)}
#dock .dock-tab.on .dock-dot{background:#fff6e4;box-shadow:none}
/* ===== v8: guided first run, swipe combos, banners ===== */
#plots{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.plot.sown svg{animation:sown .5s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 90%}
@keyframes sown{30%{transform:scale(1.1,.86)}60%{transform:scale(.96,1.06)}}
.plot.bloom .pinfo{animation:ripe 1.6s ease-in-out infinite}
@keyframes ripe{50%{transform:translateY(-3px) scale(1.07)}}
.gain{position:absolute;z-index:31;pointer-events:none;transform:translate(-50%,0);padding:1px 8px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap;background:#fff6e4;color:#8a5a12;box-shadow:0 2px 6px rgba(43,32,23,.25);animation:gain 1.2s cubic-bezier(.2,.9,.3,1) forwards}
.gain.xp{color:#2f6a4a}
@keyframes gain{0%{opacity:0;transform:translate(-50%,-4px) scale(.6)}18%{opacity:1;transform:translate(-50%,6px) scale(1.15)}70%{opacity:1;transform:translate(-50%,10px) scale(1)}100%{opacity:0;transform:translate(-50%,18px)}}
.combo{position:absolute;z-index:31;pointer-events:none;transform:translate(-50%,-50%);font-family:'Ma Shan Zheng',serif;font-size:22px;color:#fff6e4;white-space:nowrap;text-shadow:0 0 1px #6b2a17,0 2px 0 #b5322c,0 3px 8px rgba(0,0,0,.35);animation:combo .9s cubic-bezier(.2,1.5,.4,1) forwards}
.combo b{font-size:32px;margin-left:2px;color:#ffe08a;font-weight:400}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}70%{opacity:1;transform:translate(-50%,-80%) scale(1)}100%{opacity:0;transform:translate(-50%,-110%) scale(.95)}}
#modal .mscore{position:relative}
.seal-g{position:absolute;right:-4px;top:-6px;padding:4px 5px;border:3px double #b5322c;border-radius:6px;color:#b5322c;font-style:normal;font-family:'Ma Shan Zheng',serif;font-size:21px;line-height:1.05;writing-mode:vertical-rl;background:rgba(255,246,228,.7);rotate:10deg;pointer-events:none;animation:seal .42s cubic-bezier(.2,1.4,.4,1) both}
.seal-g.s5{background:#b5322c;color:#fff6e4;border-color:#fff6e4;box-shadow:0 0 0 2px #b5322c}
@keyframes seal{from{opacity:0;transform:scale(2.6)}}
.dialog.thud{animation:thud .3s}
@keyframes thud{40%{transform:translateY(3px) scale(.995)}}
.hxb{position:absolute;z-index:32;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);width:min(340px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#fff6e4 var(--grain) center/256px;border:1px solid rgba(181,50,44,.35);box-shadow:0 10px 30px rgba(43,32,23,.3);color:var(--ink);overflow:hidden;cursor:pointer;animation:bannerIn .5s cubic-bezier(.2,1.4,.4,1) both}
.hxb.out{animation:bannerOut .3s ease-in forwards}
@keyframes bannerIn{from{opacity:0;transform:translate(-50%,-30px) scale(.9)}}
@keyframes bannerOut{to{opacity:0;transform:translate(-50%,-20px) scale(.96)}}
.hxb::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-100%);animation:shine 1.1s .35s ease-out forwards;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
.hxb.hxb-lv{flex-direction:column;gap:2px;text-align:center;padding:16px 16px 14px;top:22%;background:linear-gradient(#fff6e4,#f5e2bb)}
.hxb .rays{position:absolute;left:50%;top:52px;width:320px;height:320px;margin:-160px 0 0 -160px;border-radius:50%;background:repeating-conic-gradient(rgba(255,196,80,.4) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 10%,transparent 66%);mask:radial-gradient(circle,#000 10%,transparent 66%);animation:spin 12s linear infinite;pointer-events:none}
.hxb.hxb-lv small{position:relative;letter-spacing:.4em;color:#b5322c;font-size:12px}
.hxb.hxb-lv .lvnum{position:relative;font-family:'Ma Shan Zheng',serif;font-weight:400;font-size:46px;line-height:1.1;color:#2b2a26;animation:lvpop .6s .15s cubic-bezier(.2,1.8,.4,1) both}
@keyframes lvpop{from{transform:scale(.3);opacity:0}}
.hxb.hxb-lv p{position:relative;margin:2px 0 0;font-size:13px}
.hxb.hxb-bd .bdg-i{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#b5322c;color:#fff6e4;font-style:normal;font-family:'Ma Shan Zheng',serif;font-size:24px;box-shadow:0 0 0 3px #fff6e4,0 0 0 4px #b5322c;animation:lvpop .6s .1s cubic-bezier(.2,1.8,.4,1) both}
.hxb.hxb-bd span{display:flex;flex-direction:column;min-width:0}
.hxb.hxb-bd small{font-size:11px;letter-spacing:.3em;color:#b5322c}
.hxb.hxb-bd b{font-size:18px}
.hxb.hxb-bd em{font-style:normal;font-size:12px;color:var(--ink-soft)}
#coach{position:absolute;inset:0;z-index:17;pointer-events:none}
#coach[hidden],#coach [hidden]{display:none}
.co-spot{position:absolute;border-radius:14px;box-shadow:0 0 0 200vmax rgba(30,24,16,.42);transition:left .3s,top .3s,width .3s,height .3s}
.co-spot::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2.5px solid #ffe08a;animation:coring 1.4s ease-out infinite}
@keyframes coring{0%{opacity:1;transform:scale(.96)}100%{opacity:0;transform:scale(1.14)}}
.co-hand{position:absolute;width:42px;height:49px;margin:-3px 0 0 -16px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35));animation:cotap 1.1s ease-in-out infinite}
.co-hand svg{width:100%;height:100%;display:block}
@keyframes cotap{0%,100%{transform:translate(8px,16px)}50%{transform:translate(0,0)}}
.co-hand.swipe{animation:coswipe 1.9s ease-in-out infinite}
@keyframes coswipe{0%{transform:translate(0,12px);opacity:0}12%{opacity:1;transform:translate(0,0)}75%{opacity:1;transform:translate(var(--sx),var(--sy))}100%{opacity:0;transform:translate(var(--sx),var(--sy))}}
.co-bub{position:absolute;left:12px;right:12px;margin:0 auto;max-width:380px;display:flex;align-items:flex-end;gap:6px;pointer-events:auto;animation:dlg .3s ease}
.co-av{flex:0 0 auto;width:62px;height:68px;object-fit:cover;object-position:50% 0;border-radius:50% 50% 12px 12px;background:#f3ead6;border:2px solid #fff6e4;box-shadow:0 3px 8px rgba(43,32,23,.25)}
.co-body{flex:1;min-width:0;position:relative;margin-left:4px;padding:9px 12px 6px;border-radius:12px;background:#fff6e4 var(--grain) center/256px;border:1px solid rgba(96,81,55,.3);box-shadow:0 8px 22px rgba(43,32,23,.28)}
.co-body::before{content:"";position:absolute;left:-7px;bottom:18px;width:12px;height:12px;background:#fff6e4;border-left:1px solid rgba(96,81,55,.3);border-bottom:1px solid rgba(96,81,55,.3);transform:rotate(45deg)}
.co-txt{margin:0;font-size:14px;line-height:1.6;color:var(--ink)}
.co-txt b{color:#b5322c}
.co-row{display:flex;align-items:center;gap:10px;margin-top:2px}
.co-step{flex:1;font-size:11px;color:var(--ink-soft);letter-spacing:.08em}
.co-next,.co-skip{border:0;background:none;padding:6px 2px;font:inherit;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer}
.co-next{color:#b5322c;font-weight:600;text-decoration:none}
.co-bub.ok .co-body{animation:cook .4s}
@keyframes cook{40%{transform:scale(1.05)}}
#app.coaching #hint{visibility:hidden}
.gifts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.gifts span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-weight:600;animation:lvpop .5s .3s cubic-bezier(.2,1.8,.4,1) both}
.gifts span:nth-child(2){animation-delay:.42s}.gifts span:nth-child(3){animation-delay:.54s}
.gifts .bi{width:18px;height:18px}
.co-grad{position:relative;width:min(100%,300px);height:auto;border-radius:10px}
.co-grad.fallback{width:auto;height:150px}
/* v17: polish — pollination filter, gallery pin & lazy paint, kiln vessel preview, stem cycling */
#plots.pol-mode .plot:not(.bloom),#plots.pol-mode .plot.poled{opacity:.42;filter:grayscale(.35)}
.works .work{position:relative;content-visibility:auto;contain-intrinsic-size:160px 230px}
.work .pin-tag{position:absolute;top:12px;left:14px;z-index:2;font-style:normal;font-family:var(--f-display);font-size:13px;line-height:1.05;writing-mode:vertical-rl;padding:4px 2px;background:#a43a2e;color:#fff6e4;border-radius:2px;box-shadow:0 2px 5px rgba(0,0,0,.22)}
.kvtype{padding:7px 10px;border-radius:8px;background:rgba(255,250,240,.85);border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.kvtype b{color:var(--rouge)}
.kvtype small{display:block;color:var(--ink-soft);font-size:11.5px}
#v-studio .insp-nm{font-weight:700;font-size:15px;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(100% - 210px);flex-shrink:0;text-align:left}
#v-studio .insp-nm em{font-style:normal;font-size:11px;color:var(--ink-soft);margin-left:2px}
#v-studio .insp-h:has(>.cyc~.cyc~.cyc) .insp-nm{flex-shrink:1;letter-spacing:0;max-width:none}
@media (prefers-reduced-motion:reduce){.co-hand,.co-spot::after,.plot.bloom .pinfo,.plot.sown svg,.hxb,.hxb::after,.hxb .rays,.combo,.seal-g,.gifts span{animation:none}}
/* v18: mobile-friendly PNG scroll preview & save overlay */
#pngView{position:absolute;inset:0;z-index:18;background:rgba(28,22,16,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.png-dlg{max-width:400px;background-color:var(--jade);background-clip:padding-box}
.png-wrap{display:flex;justify-content:center;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.png-img{display:block;width:auto;height:auto;max-width:100%;max-height:min(56vh,56dvh);margin:0 auto;border-radius:8px;box-shadow:0 8px 20px rgba(43,32,23,.22);-webkit-touch-callout:default!important;-webkit-user-select:auto!important;user-select:auto!important;pointer-events:auto!important;touch-action:auto!important}
.png-tip{margin:10px 0 0;font-size:13px;line-height:1.55;color:var(--ink-soft)}
.png-tip b{color:var(--rouge)}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box}
/* ---------- v19 山野探险：人跟着手指走，东西直接画在景里，不加圆底 ---------- */
.pano.wx{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pano.wx .wj-walker{left:0;transform:translate3d(28vw,0,0) translateX(-50%);height:max(96px,25%)}
.wx-spots{top:0;height:100%;z-index:5}
/* 地面条上沿淡入，山脚往下多垫一截，免得出现一道硬直线、树和竹子被拦腰截断 */
.pano.wx .wj-hills{bottom:30%}
.pano.wx .wj-ground{-webkit-mask-image:linear-gradient(transparent,#000 15%);mask-image:linear-gradient(transparent,#000 15%)}
/* 荷塘的荷叶、睡莲只长在路前面的水里，不上岸、不盖住石板路 */
.wx-deco{top:0;height:100%;z-index:4}
.wx-deco .wx-dec{bottom:-2%;height:12cqh;transform:translateX(-50%) scaleX(var(--flip))}.wx-deco .wx-dec.k-lily{bottom:2%;height:5.5cqh}.wx-deco .wx-dec.k-mush{bottom:3%;height:7cqh}
.pano.wx .wj-walker{z-index:5}
/* 画里的东西用 Tab 选中时也只泛柔光，不画矩形框（框压在画上像截图标注） */
.xs:focus-visible,.wx-box button:focus-visible{outline:none;filter:drop-shadow(0 0 5px rgba(255,246,206,.95)) drop-shadow(0 0 2px #fff)}
.xs{position:absolute;bottom:var(--b);height:11cqh;padding:0;margin:0;border:0;background:none;line-height:0;pointer-events:auto;cursor:pointer;transform:translateX(-50%);transform-origin:50% 100%;-webkit-tap-highlight-color:transparent;transition:transform .25s,opacity .4s,filter .2s;filter:drop-shadow(0 2px 2px rgba(46,45,31,.18))}
.xs img,.xs>svg{display:block;height:100%;width:auto;max-width:none;pointer-events:none}
.xs .ico{width:auto;height:100%}
.xs::after{content:"";position:absolute;top:-2px;right:6%;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle,#fff 22%,rgba(255,238,170,.85) 44%,transparent 70%);animation:twk 2.6s ease-in-out infinite;animation-delay:calc(var(--b)*-.17s);pointer-events:none}
.xs.k-npc::after{content:none}
.xs.near{filter:drop-shadow(0 0 5px rgba(255,246,206,.95)) drop-shadow(0 0 2px #fff);transform:translateX(-50%) scale(1.06)}
.xs.taken{opacity:0;transform:translateX(-50%) translateY(-40%) scale(.6);pointer-events:none}
.xs.k-dew{height:9cqh}.xs.k-clay{height:8cqh}.xs.k-seed{height:12cqh}.xs.k-page{height:7.5cqh}.xs.k-stone{height:9cqh}.xs.k-bush{height:13cqh}
.xs.k-flower{height:19cqh;aspect-ratio:1;animation:swayx 4s ease-in-out infinite;animation-delay:calc(var(--b)*-.3s)}
.xs.k-flower .ico{position:absolute;left:50%;bottom:0;height:100%;width:auto;translate:-50% 0;transform-origin:50% 100%}.xs.k-flower .ico:nth-child(1){rotate:-17deg;scale:.8}.xs.k-flower .ico:nth-child(3){rotate:15deg;scale:.88}
.xs.fl-lotus{height:14cqh;aspect-ratio:auto;animation:none}.xs.fl-waterlily{height:7cqh;aspect-ratio:auto;animation:none}
.xs.rare{filter:drop-shadow(0 0 7px rgba(239,191,82,.9))}
.xs.k-curio{width:8cqh;height:8cqh}

/* ================= UI 规范（按钮与窗口的唯一来源） =================
   新界面只从这里挑现成的档位和皮肤，不再给某一个按钮或窗口单独写高度/宽度/皮肤。
   确实需要不一样时，先在这里加一档，并写清楚为什么。
   按钮
   · 高度三档：--c-sm 小 / --c-md 默认 / --c-lg 一页里的主操作（“完成作品”“下一步”）；具体像素随屏幕自适应，见下方 :root
   · 形状三种：
       文字钮：高度取上面的档位
       方形图标钮：宽和高都取 --c-md（顶栏、关闭按钮）
       圆形工具钮：--c-round，图标加两个字，用在花畦工具和花艺台侧栏
   · 皮肤三种：纸（默认，ui_card）/ 朱漆（主操作、当前选中，ui_btn_red）/ 瓷（圆形工具钮，ui_round）
   · 两个特例，各有原因：等级环是圆的，因为外圈就是经验进度条，但高度和顶栏一致，都是 --c-md；
     花艺台评分章是 60 的圆，因为里面要放 22px 的大分数
   窗口
   · 大面板 ui_panel：弹窗、手账页、出游卡、对话
     矮屏（高 ≤ 500，横屏手机）上的小镇对话框边框收到 16px：它压在小镇画面上，又要放下名字、台词和按钮，28px 的花边太占地方
   · 标题两种：页面标题用卷轴 ui_ribbon（山野、手账各页）；弹窗标题一律用题字 .ink-t（modal() 自动套上，见 inkTitles）
   · 小卡 ui_card：卡片、订单、浮层提示（.tip-pop）、底部操作条
   · 牌匾 ui_btn_paper：山野里的路程牌。花畦提示语改用小卡 ui_card，按字数收宽
   · 店招 ui_plaque：页头标题（花铺、花艺台）。整块木匾按原图比例显示，不拉伸，外层不再叠牌匾或卷轴
   · 印章 .yin：徽章。两字竖排长方印，朱底白字（阴文）与白底朱字（阳文）交替，钤印的斑驳边用 #hx-stamp 滤镜；
     没得到的只留浅虚框。手账里的徽章墙是一页印谱，不再一格一张卡；获得徽章的横幅用小卡皮肤，印章盖下去
   · 题字 .ink-t：弹窗标题、画面里的地名、山野小游戏的标题。墨色书法字配一方朱印，不垫底板、不套卷轴：
     地名浮在山水上，垫了木牌就像按钮；小游戏是景里的一段插曲，卷轴页头太重，压过了下面的游戏画面
*/
/* 档位随屏幕连续缩放：以屏幕短边（vmin）为准，小屏 SE 约 34，常见手机约 36，平板与电脑封顶 40；
   其余档位都由 --c-md 推出来，彼此比例不变。触屏上小档不低于 36，保证手指点得到。 */
:root{--c-md:clamp(34px,calc(26px + 2.7vmin),40px);--c-sm:max(30px,calc(var(--c-md) - 4px));--c-lg:calc(var(--c-md) + 8px);--c-round:calc(var(--c-md)*1.45)}
@media (pointer:coarse){:root{--c-sm:max(36px,calc(var(--c-md) - 4px))}}
.btn,.hud-back,.pill,.subnav button,.seg>div{height:var(--c-md)}
.btn.sm,.chip,.ksteps button{height:var(--c-sm)}
.btn.lg,.st-quick button{height:var(--c-lg)}
.snd,.ib,.so-x,.dlg-x,.talk-x,.lvring{width:var(--c-md);height:var(--c-md);min-width:0;padding:0;flex-shrink:0}
.order-x,.mode-exit{width:var(--c-sm);height:var(--c-sm);padding:0;flex-shrink:0}
.g-tools .tool,.st-side button{width:var(--c-round);height:var(--c-round);flex:0 0 var(--c-round)}
/* 特例：小镇的「寻人」钮压在画上，只占右下角一枚，圆瓷片缩到 --c-lg：图标是画里那种对话泡，下面一行小字是还有几位在等 */

/* 花畦：按提示条和操作条之间实际剩下的高度撑满（.g-field 是尺寸容器），不再用「屏高减一个估算值」——
   那个估算值是按竖屏手机定的，窗口稍矮一点，花畦就缩成一小撮，上下左右却空着一大片。
   系数是实测的：花畦整体高 ≈ 宽 × 斜率 + 名牌高，反过来求宽。
   横着的窗口（宽 ≥ 600 且宽 > 高）一律排成 6 列两行：高度是瓶颈，排成 4 列三行每块地只剩一小撮 */
.g-field{flex:1 1 0;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center}

@supports (height:1cqh){

    if((!r.sp||have.includes(r.sp))&&(!r.kinds||have.length>=r.kinds+1)&&(!r.roles||r.roles.every(x=>have.some(id=>F[id].role===x)))&&(!r.own||S.pots.length>0)&&(!r.fam||have.some(id=>F[id].fam===r.fam))){
      const seed=Math.random()<.65?(F[tm.id].r>=1?tm.id:pick(BASE.filter(id=>!F[id].wild&&F[id].r===2))):null;
      return{k:S.nid++,who:c.n,say,req:r,coins:Math.round(130+level()*6),exp:26,seed,pal:c.id}}}
  for(let n=0;n<30;n++){const t=pick(TPL),r=JSON.parse(JSON.stringify(t.req));let say=t.say;
    if(S.orders.some(o=>o.who===t.who))continue;
    if(r.fam&&!have.some(id=>F[id].fam===r.fam))continue;
    if(r.kinds&&have.length<r.kinds+1)continue;
    if(r.roles&&!r.roles.every(x=>have.some(id=>F[id].role===x)))continue;
    if(r.sp){const pool=have.filter(id=>r.sp===2?F[id].role==='主':F[id].role!=='叶');if(!pool.length)continue;r.sp=pick(pool);say=say.replace('{f}',F[r.sp].n)}
    if(r.score&&level()<2)r.score-=10;

  return null}

const footBorders=[['none','留白'],['key','回纹'],['petal','仰莲瓣'],['leaf','蕉叶']];
function footBorder(p){
  if(!p.border||p.border==='none')return '';
  const tile={key:'M-6,0V-6H4V-2H-2V-4H1M4,-6H6',petal:'M-6,0Q-7,-5 0,-10Q7,-5 6,0Q0,2 -6,0ZM-3,-1Q-4,-5 0,-7Q4,-4 3,-1',leaf:'M-5,0Q-4,-6 0,-12Q4,-7 5,0ZM0,-1V-10M0,-3L-2,-5M0,-5L2,-7'}[p.border];
  if(!tile)return '';
  const scale=Math.min(1,p.H/115,p.r[0]/23);
  let tiles='';
  for(let i=-7;i<=7;i++)tiles+=`<path transform="translate(${i*12} ${R(-.075*i*i)})" d="${tile}"/>`;
  return `<g transform="translate(200 472) scale(${scale})" stroke-width="1.1">${tiles}<path d="M-90,-3Q0,5 90,-3"/></g>`;
}
function paintedMotif(key,ground,ink,aspect=1){
  const colors=ink===ENAMEL_INK?{flower:'#dc8469',leaf:'#70946f'}:{flower:mix(ground,ink,.33),leaf:mix(ground,ink,.75)};
  return `<g color="${ink}" stroke="currentColor" fill="none" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${kilnMotifs[key].draw(ground,colors,aspect)}</g>`;
}

function kilnPatternCards(p){

  const cards=motifGroups[motifGroup].map(key=>{
    const art=kilnMotifs[key];
    return `<button type="button" class="motif-card" data-mo="${key}" aria-pressed="${p.mo===key}"><svg aria-hidden="true" viewBox="-43 -25 86 50" style="background:${p.gl}">${paintedMotif(key,p.gl,p.pig)}</svg><span>${art.name}</span></button>`;
  }).join('');
  return `<div class="chips" role="group" aria-label="纹样分类">${tabs}</div><div class="motif-grid">${cards}</div>`;
}

/* combos: several actions in quick succession climb the scale */
const combo={n:0,t:0};
function comboHit(el,label){const now=Date.now();combo.n=now-combo.t<1600?combo.n+1:1;combo.t=now;chime(combo.n+1);
  if(label&&combo.n>=2){const[x,y]=appXY(el);$('#app>.combo')?.remove();const e=document.createElement('div');e.className='combo';e.innerHTML=`${label}<b>×${combo.n}</b>`;e.style.left=x+'px';e.style.top=(y-54)+'px';$('#app').appendChild(e);setTimeout(()=>e.remove(),900);buzz(Math.min(30,8+combo.n*3))}
  return combo.n}

let lastSeed=null;const plant0=plant;
plant=(i,id)=>{const had=!!S.plots[i];plant0(i,id);if(had||!S.plots[i])return;lastSeed=id;const el=$$('#plots .plot')[i];
  if(el){el.classList.remove('sown');void el.offsetWidth;el.classList.add('sown');fxAt(el,(x,y)=>{for(let k=0;k<7;k++)addFx('pt',x,y+22,`background:${k%2?'#8a6a45':'#b08a5e'};width:6px;height:6px;--dx:${rint(-28,28)}px;--dy:${rint(-30,-6)}px`)})}buzz(8)};

/* swipe across the beds: sow, water, weed and pick everything the finger passes */
let sweep=null,sweepJust=0;
function sweepHit(el){if(!el||sweep.seen.has(el))return;sweep.seen.add(el);const i=+el.dataset.i;if(i>=plotCount())return;const p=S.plots[i];
  if(!p){const id=S.seeds[lastSeed]>0?lastSeed:IDS.filter(x=>S.seeds[x]>0).sort((a,b)=>F[a].r-F[b].r||S.seeds[b]-S.seeds[a])[0];if(!id)return;plant(i,id);comboHit(el,'连种');sweep.did=1;return}
  if(p.p>=F[p.id].t){harvest(i,el);sweep.did=1;return}
  if(p.pest){const w=p.pest==='weed';p.pest=null;bump('tend');fxAt(el,(x,y)=>addFx('pop',x,y+10,'',w?'拔掉了杂草':'小蜗牛慢慢爬走了'));comboHit(el,'照料');sweep.did=1;refreshPlots();return}
  if(water(i,el,true)){comboHit(el,'连浇');sweep.did=1;refreshPlots()}}
function initSweep(){
  $('#plots').addEventListener('pointerdown',e=>{if(fertMode||polMode||(e.button||0)>0)return;const el=e.target.closest('.plot');if(el)sweep={start:el,seen:new Set(),moved:false,did:0}});
  addEventListener('pointermove',e=>{if(!sweep)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('#plots .plot');if(!el)return;
    if(!sweep.moved){if(el===sweep.start)return;sweep.moved=true;sweepHit(sweep.start)}sweepHit(el)});
  const end=()=>{if(!sweep)return;if(sweep.moved){sweepJust=Date.now();if(sweep.did){refreshPlots();hints();save()}}sweep=null};
  addEventListener('pointerup',end);addEventListener('pointercancel',end)}

/* banners: level up and badges drop in from the top, one at a time */
const BQ=[];let bannerOn=false;
function banner(html,cls){BQ.push([html,cls]);if(!bannerOn)nextBanner()}
function nextBanner(){const b=BQ.shift();if(!b){bannerOn=false;return}bannerOn=true;const e=document.createElement('div');e.className='hxb '+b[1];e.innerHTML=b[0];$('#app').appendChild(e);
  let done=false;const close=()=>{if(done)return;done=true;e.classList.add('out');setTimeout(()=>{e.remove();nextBanner()},320)};e.addEventListener('click',close);setTimeout(close,2900)}
function lvBanner(a,gift){const nw=IDS.filter(id=>F[id].lv===a),lines=[nw.length?`花铺上新：${nw.map(id=>F[id].n).join('、')}`:'',gift].filter(Boolean);
  banner(`<i class="rays"></i><small>升级</small><b class="lvnum">Lv.${a}</b>${lines.map(t=>`<p>${t}</p>`).join('')}`,'hxb-lv');
  sfx('rare');setTimeout(()=>tone(1568,.9,.05),450);buzz([18,50,26]);const r=$('#lvring');r.classList.remove('bump');void r.offsetWidth;r.classList.add('bump')}
/* 顶栏小浮窗：点等级环、花币时说明是什么；再点一次或点别处收起 */
function hudTip(anchor,html){let t=$('#hudTip');if(t&&!t.hidden&&t.dataset.for===anchor.id){t.hidden=true;return}
  if(!t){t=document.createElement('div');t.id='hudTip';t.className='tip-pop';t.setAttribute('role','dialog');$('#app').appendChild(t)}
  const a=$('#app').getBoundingClientRect(),r=anchor.getBoundingClientRect();t.innerHTML=html;t.dataset.for=anchor.id;t.hidden=false;
  t.style.top=(r.bottom-a.top+8)+'px';t.style.right='12px';t.style.setProperty('--ax',(a.right-12-(r.left+r.width/2))+'px');clearTimeout(hudTip.k);hudTip.k=setTimeout(()=>{t.hidden=true},8000)}
function lvTipHTML(){const l=level(),a=XP[l-1],b=XP[l];
  if(b===undefined)return`<h4>等级 ${l}<small>已到最高级</small></h4><p>收花、交订单、卖插花、花会展出都会积累经验。</p>`;
  const nw=IDS.filter(id=>F[id].lv===l+1).map(id=>F[id].n),p=clamp((S.exp-a)/(b-a),0,1)*100;
  return`<h4>等级 ${l}<small>经验 ${S.exp-a} / ${b-a}</small></h4><div class="xpbar"><i style="width:${p}%"></i></div><p>收花、交订单、卖插花、花会展出都会涨经验，等级环外圈就是经验进度。</p>`+(nw.length?`<p>升到 ${l+1} 级，花铺上新：<b>${nw.join('、')}</b></p>`:`<p>再升 ${b-S.exp} 点经验到 ${l+1} 级。</p>`)}
function badgeBanner(b){banner(`<i class="yin stamp" style="--rot:-4deg" aria-hidden="true">${b[1]}</i><span><small>获得徽章</small><b>${b[1]}</b><em>${b[2]} · 贺礼 40 花币</em></span>`,'hxb-bd');setTimeout(()=>sfx('rare'),200);buzz([12,40,12])}

/* finished work: the score ticks up, stars ring one by one, then a grade seal comes down */
function finishJuice(sc){const n=starN(sc.total);for(let k=0;k<8;k++)setTimeout(()=>tone(900+k*70,.06,.025,'triangle'),520+k*110);
  for(let i=0;i<n;i++)setTimeout(()=>chime(i+3),1300+i*130);
  const g=n>=5?'神品':n>=4?'妙品':n>=3?'能品':'佳作';
  setTimeout(()=>{const box=$('#modal .mscore');if(!box)return;box.insertAdjacentHTML('beforeend',`<i class="seal-g s${n}">${g}</i>`);tone(98,.4,.14,'triangle');tone(196,.25,.06,'triangle',.02);buzz(24);const d=$('#modal .dialog');d?.classList.add('thud');setTimeout(()=>d?.classList.remove('thud'),320)},1300+n*130+240)}

/* ----- guided first run, led by the flower-shop keeper ----- */
const tutFlag={};
function tutFast(){return!!S&&S.tut<=5}
const cutN=()=>IDS.reduce((a,id)=>a+(S.cut[id]||0),0);
const vis=el=>{if(!el)return null;if(!el.getClientRects)return el;const r=el.getBoundingClientRect();return r.width&&r.height?el:null};
const planted=()=>S.plots.slice(0,plotCount()).filter(Boolean).length;
const growing=()=>$$('#plots .plot').find((el,i)=>{const p=S.plots[i];return p&&i<plotCount()&&p.p<F[p.id].t});
const seedCard=()=>$('#modal [data-act="plant"]');
function lastHead(){const svg=$('#stage svg'),s=S.arr[S.arr.length-1];if(!svg||!s||!svg.getScreenCTM)return null;const m=svg.getScreenCTM();if(!m)return null;
  const x=m.a*s.x+m.c*s.y+m.e,y=m.b*s.x+m.d*s.y+m.f;return{getBoundingClientRect:()=>({left:x-26,top:y-26,width:52,height:52,right:x+26,bottom:y+26})}}
const TUT=[
  {v:'garden',tx:()=>'这是你的花畦。<b>点一块空花畦</b>，种下第一粒花种吧。',tg:()=>$('#modal').hidden?$('#plots .plot.empty'):seedCard(),ok:()=>planted()>=1},
  {v:'garden',tx:()=>`插一瓶花要三枝。试试<b>用手指划过空花畦</b>，一口气种下去（${Math.min(planted(),3)}/3）`,tg:()=>$('#modal').hidden?$('#plots .plot.empty'):seedCard(),sw:()=>$$('#plots .plot.empty'),ok:()=>planted()>=3||!IDS.some(id=>S.seeds[id]>0)},
  {v:'garden',tx:()=>'种子渴了。点<b>「照料」</b>，一次浇遍整片花田。',tg:()=>$('#waterAll'),ok:()=>!S.plots.some(p=>p&&p.p<F[p.id].t&&p.wu<=Date.now())},
  {v:'garden',tx:()=>fertMode?'点一株正在长的花，滴下露水。':'等不及？点<b>「露水」</b>，让花一下子长高一截。',tg:()=>fertMode?growing():$('#fertBtn'),ok:()=>tutFlag.dew||S.dew<1||!growing()},
  {v:'garden',tx:()=>$('#plots .plot.bloom')?`花开了！点它采下来，<b>划过一排</b>还能连着采（${Math.min(cutN(),3)}/3 枝）`:'新手花期，花长得特别快，稍等片刻。土干了冒出水滴，就点「照料」。',tg:()=>$('#plots .plot.bloom'),sw:()=>$$('#plots .plot.bloom'),ok:()=>cutN()>=3||S.arr.length>0},
  {tx:()=>'花枝够了！去<b>「花艺」</b>插第一瓶花。',tg:()=>$('#dock .dock-tab[data-go="studio"]'),ok:()=>view==='studio'},
  {v:'studio',tx:()=>`点花材，插进瓶里（${Math.min(S.arr.length,3)}/3）。`,tg:()=>vis($('#tray [data-add]'))||$('#stTabs [data-deck="tray"]'),ok:()=>S.arr.length>=3},
  {v:'studio',tx:()=>'<b>按住瓶里的花头拖一拖</b>，定下高低与走势。',tg:lastHead,next:1,ok:()=>tutFlag.drag},
  {v:'studio',tx:()=>$('#modal').hidden?'满意了，就点<b>「完成作品」</b>。':'第一件作品！<b>售出</b>换些花币吧。',tg:()=>$('#modal').hidden?$('#finishArr'):$('#modal .dlg-actions [data-act="finish"]:not([data-o])')||$('#modal [data-act="finish"]'),wait:2700,ok:()=>S.done>=1}];
const PLACE={garden:'小院',studio:'花艺'};
let coachEl=null,coachT=null,coachSw=null,coachRAF=0,modalSeen=0,lastCoachTxt='';
function coachDom(){if(coachEl)return coachEl;const c=coachEl=document.createElement('div');c.id='coach';c.hidden=true;
  c.innerHTML=`<div class="co-spot" hidden></div><div class="co-hand" hidden><svg viewBox="0 0 48 56"><path d="M18 4c3 0 5 2 5 5v14l2-1c3-1 5 0 6 2l1-1c3-1 5 1 6 3c3 0 5 2 5 5v9c0 8-6 14-14 14h-4c-5 0-9-3-11-7l-7-13c-1-3 0-5 2-6s5 0 6 2l2 3V9c0-3 2-5 5-5z" fill="#fff6e4" stroke="#3a2c28" stroke-width="2.4" stroke-linejoin="round"/><path d="M23 23v9M31 24v8M38 27v6" stroke="#3a2c28" stroke-width="1.6" stroke-linecap="round" opacity=".5"/></svg></div><div class="co-bub"><img class="co-av" src="${A('assets/guide_av.webp')}" width="252" height="276" alt="花铺掌柜" draggable="false"><div class="co-body"><p class="co-txt" aria-live="polite"></p><div class="co-row"><span class="co-step"></span><button class="co-next" type="button" hidden>下一步</button><button class="co-skip" type="button">跳过引导</button></div></div></div>`;
  $('#app').appendChild(c);
  $('.co-skip',c).onclick=()=>{S.tut=99;save();coachHide();hints();toast('引导已跳过，顶上的提示会一直陪着你')};
  $('.co-next',c).onclick=()=>{S.tut++;save();coachPing();coachTick()};
  return c}
function coachHide(){if(coachEl)coachEl.hidden=true;$('#app').classList.remove('coaching');coachT=null}
function coachPing(){chime(6);buzz(8);const b=coachEl&&$('.co-bub',coachEl);if(b){b.classList.remove('ok');void b.offsetWidth;b.classList.add('ok')}}
function tutDone(){S.tut=99;S.coins+=100;S.dew+=2;S.bfly+=1;hud();save();coachHide();hints();
  setTimeout(()=>{if(stale)return;sfx('rare');buzz([20,60,20]);
    modal(`<div class="center"><div class="reveal"><i class="rays"></i><img class="co-grad" src="${A(TUT_ART)}" width="960" height="640" onerror="this.src='${A('assets/n_keep.webp')}';this.classList.add('fallback')" alt="" draggable="false"></div><p class="muted" style="margin:0;letter-spacing:.3em">新手出师</p><h2 class="h-title" style="justify-content:center">小院开张啦</h2><p class="say">种花、照料、采花、插花，你都会了。<br>掌柜送上开张礼：</p><div class="gifts"><span><i class="coin"></i>100</span><span><i class="bi">${DEWSVG}</i>露水 ×2</span><span><i class="bi">${BFLY}</i>蝴蝶 ×1</span></div><p class="muted" style="font-size:12.5px;line-height:1.7">往后：两朵花同时开着，试试「授粉」育出花铺买不到的品种；去「山野」散步收露水和蝴蝶；「小镇」的乡邻也在等你的花。</p><button class="btn primary" data-act="close">收下</button></div>`);
    confetti(['#f7c6d6','#f1cf6d','#9dbcab','#b5322c','#fff6e4'])},1000)}
const TUT_ART='assets/guide_done.webp';
function coachTick(){if(!S||stale||document.hidden)return;
  if(S.tut>=99||!S.intro){coachHide();return}
  let st=TUT[S.tut-1];while(st&&st.ok()){S.tut++;save();coachPing();st=TUT[S.tut-1]}
  if(!st){tutDone();return}
  const modalOpen=!$('#modal').hidden;let el,txt=st.tx(),sw=null;
  if(st.v&&view!==st.v){el=vis($(`#dock .dock-tab[data-go="${st.v}"]`))||vis($('#backBtn'));txt=`回到<b>「${PLACE[st.v]}」</b>继续。`}
  else{el=vis(st.tg());const l=st.sw&&!modalOpen?st.sw().filter(e=>vis(e)):[];if(l.length>=2)sw=l}
  const inModal=!!(el&&el.closest&&el.closest('#modal'));
  if(!modalOpen)modalSeen=0;else if(inModal&&!modalSeen)modalSeen=Date.now();
  if(walk||(modalOpen&&!inModal)||(inModal&&Date.now()-modalSeen<(st.wait||350))){coachHide();return}
  const c=coachDom();coachT=el;coachSw=sw;if(txt!==lastCoachTxt){lastCoachTxt=txt;$('.co-txt',c).innerHTML=txt}$('.co-step',c).textContent=`新手 ${S.tut} / ${TUT.length}`;$('.co-next',c).hidden=!st.next;
  if(c.hidden){c.hidden=false;$('#app').classList.add('coaching')}
  if(!coachRAF)coachRAF=requestAnimationFrame(coachFrame)}
function coachFrame(){coachRAF=0;if(!coachEl||coachEl.hidden||document.hidden)return;const a=$('#app').getBoundingClientRect(),spot=$('.co-spot',coachEl),hand=$('.co-hand',coachEl),bub=$('.co-bub',coachEl);
  const t=coachT&&coachT.isConnected!==false?coachT:null,list=coachSw&&coachSw.every(e=>e.isConnected)?coachSw:null;
  const rs=(list||(t?[t]:[])).map(e=>e.getBoundingClientRect());
  if(rs.length){const pad=6,l=Math.min(...rs.map(r=>r.left))-a.left-pad,tp=Math.min(...rs.map(r=>r.top))-a.top-pad,w=Math.max(...rs.map(r=>r.right))-a.left+pad-l,h=Math.max(...rs.map(r=>r.bottom))-a.top+pad-tp;
    spot.hidden=false;Object.assign(spot.style,{left:l+'px',top:tp+'px',width:w+'px',height:h+'px'});
    const r0=rs[0],r1=rs[rs.length-1],hx=r0.left-a.left+r0.width/2,hy=r0.top-a.top+r0.height*(list?.45:.5);
    hand.hidden=false;hand.classList.toggle('swipe',!!list);Object.assign(hand.style,{left:hx+'px',top:hy+'px'});
    if(list){hand.style.setProperty('--sx',(r1.left+r1.width/2-r0.left-r0.width/2)+'px');hand.style.setProperty('--sy',(r1.top+r1.height/2-r0.top-r0.height/2)+'px')}
    if(tp+h/2>a.height*.48){bub.style.top='';bub.style.bottom=Math.max(8,a.height-tp+12)+'px'}else{bub.style.bottom='';bub.style.top=Math.min(a.height-150,tp+h+58)+'px'}}
  else{spot.hidden=hand.hidden=true;const p=view==='garden'&&$('#plots');const pr=p&&p.getBoundingClientRect();bub.style.top='';bub.style.bottom=(pr&&pr.height?a.bottom-pr.top+10:150)+'px'}
  coachRAF=requestAnimationFrame(coachFrame)}
setInterval(coachTick,250);

  addEventListener('resize',()=>{if(view==='town'){$('#app').style.setProperty('--hz',Math.round(innerHeight*.4)+'px');townPick()!==TOWN?renderTown():layoutTown()}else layoutScene()});setTimeout(layoutScene,400);

  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){clearTimeout(saveT);writeSave();stopJourney();clearTimeout(AU.timer);AU.ctx?.suspend?.()}

    modal(`<div class="center"><h2 class="h-title" style="justify-content:center">小院在别处开着</h2><p class="say">另一个窗口正在照看这座小院。为免两边的存档互相覆盖，这个窗口先歇下了。</p><button class="btn primary" data-act="reload">在这里继续</button></div>`,false,{dismissible:false});stale=true});
  window.claude?.hot?.snapshot?.(()=>({S}));
  if(S.intro&&awayMsg)modal(awayMsg);else if(S.intro&&S.termSeen!==term().n)termModal();
  if(!S.intro)modal(`<div class="center welcome-art"><img class="splash" src="${A('assets/splash.webp')}" width="900" height="600" alt="" draggable="false"><h2 class="logo big" style="font-size:40px;margin:4px 0">${[...'花信小筑'].map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</h2><p class="muted" style="margin:0">风有信，花不误。一方小院，四时花开。</p></div>
   <p class="say" style="text-align:center;margin:12px 0 4px">花铺掌柜会陪你走一遍：<b>播种 → 照料 → 采花 → 插花</b>。<br>授粉育种、山野散步、乡邻往来，之后慢慢都会遇到。不赶时间。</p>
   <div class="center"><button class="btn primary" data-act="start">推开院门</button></div>`);
}
if(window.claude?.hot?.ready)window.claude.hot.ready(start);else start(window.claude?.hot?.data??{});
})();
